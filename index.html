ut", "16 7 1 5 3 11 | 6 11"]]}, {"h": "Сортировка", "b": [["p", "- `std::sort(v.begin(), v.end());` из `<algorithm>` — по возрастанию\n- `std::sort(v.begin(), v.end(), std::greater<int>());` из `<functional>` — по убыванию\n- нужны итераторы произвольного доступа: для `vector`, `deque`, `array` и обычных массивов (`std::sort(a, a + n)`)"]]}, {"h": "Шаблонные функции для контейнеров (3.7.7)", "b": [["code", "template <typename T>\nvoid PrintIterator(T& c) {\n    for (typename T::iterator it = c.begin(); it != c.end(); it++) std::cout << *it << \" \";\n}"], ["p", "Перед зависимым именем `T::iterator` пишут `typename` — иначе компилятор не знает, что это тип. Через итераторы функция работает с любым контейнером, через `[]` и `at` — только с `array`, `vector`, `deque`."]]}], "t36": [{"h": "std::deque", "b": [["p", "Двусторонняя очередь из `<deque>`: быстро добавлять и удалять **с обоих концов** и есть доступ по индексу."], ["p", "- `push_front`, `pop_front`, `push_back`, `pop_back`, `[]`, `at`, `insert`, `erase` — как у `vector`, плюс операции с началом\n- элементы не обязательно лежат подряд (внутри несколько блоков), поэтому нет `reserve`\n- итераторы произвольного доступа, `std::sort` работает"]]}, {"h": "std::list", "b": [["p", "Двусвязный список из `<list>`."], ["p", "- нет `[]` и `at`; итераторы двунаправленные: `++it`, `--it`, но не `it + 1`. Вторая позиция — `++lst.begin()` или `std::next(lst.begin())`\n- вставка и удаление в любом месте — быстро, меняются только указатели\n- `std::sort` не подходит (нужен произвольный доступ), у списка свой `lst.sort()`"], ["tbl", [["Метод `list`", "Действие"], ["`sort()`, `sort(std::greater<int>())`", "сортировка"], ["`reverse()`", "разворот"], ["`unique()`", "удалить **подряд идущие** повторы (поэтому сначала `sort`)"], ["`merge(other)`", "слить два **отсортированных** списка; `other` становится пустым"], ["`splice(pos, other)`", "перенести узлы `other` в позицию `pos` без копирования"], ["`remove(x)`", "удалить все элементы, равные x"], ["`remove_if(pred)`", "удалить элементы, для которых `pred` вернул `true`"]]], ["code", "bool less7(int v) { return v < 7; }\nint main() {\n    std::list<int> l = {7, 1, 9, 1, 12, 1};\n    l.sort(); l.unique();\n    for (int x : l) std::cout << x << \" \";\n    std::cout << \"| \";\n    l.remove_if(less7);\n    for (int x : l) std::cout << x << \" \";\n}"], ["out", "1 7 9 12 | 7 9 12"]]}, {"h": "std::forward_list", "b": [["p", "Односвязный список из `<forward_list>`: идти можно только вперёд."], ["p", "- нет обратного итератора, `push_back`, `back`, `size`\n- есть `push_front`, `pop_front`, `sort`, `reverse`, `merge`, `remove`, `unique`\n- вставка и удаление — **после** позиции: `insert_after(it, x)`, `erase_after(it)`. Чтобы вставить **перед** узлом, нужен предыдущий, а назад по такому списку не пройти"], ["code", "std::forward_list<int> f = {7, 1, 9};\nf.push_front(8);\nf.insert_after(f.begin(), 0);\nf.erase_after(++f.begin());\nfor (int x : f) std::cout << x << \" \";"], ["out", "8 0 1 9"]]}], "t37": [{"h": "Адаптеры queue и stack", "b": [["p", "`std::queue` (`<queue>`) и `std::stack` (`<stack>`) — **адаптеры**: они дают интерфейс очереди или стека поверх другого контейнера (по умолчанию `std::deque`). Итераторов, `[]` и списков инициализации у них нет."], ["tbl", [["", "`std::queue` (FIFO)", "`std::stack` (LIFO)"], ["добавить", "`push(x)` — в конец", "`push(x)` — на вершину"], ["убрать", "`pop()` — из начала", "`pop()` — с вершины"], ["посмотреть", "`front()`, `back()`", "`top()`"], ["общие", "`size()`, `empty()`", "`size()`, `empty()`"]]], ["p", "- `pop()` ничего не возвращает: сначала читают `front()`/`top()`, потом снимают\n- перебрать элементы можно, только извлекая их: `while (!q.empty()) { use(q.front()); q.pop(); }`\n- другой базовый контейнер: `std::stack<int, std::vector<int>> st;`"], ["code", "std::queue<int> q;\nstd::stack<int> st;\nfor (int i = 1; i <= 3; i++) { q.push(i); st.push(i); }\nwhile (!q.empty()) { std::cout << q.front(); q.pop(); }\nstd::cout << \" \";\nwhile (!st.empty()) { std::cout << st.top(); st.pop(); }"], ["out", "123 321"]]}, {"h": "Какой контейнер выбрать (таблица 3.9)", "b": [["tbl", [["Контейнер", "Добавление", "Доступ по индексу", "Итераторы", "Размер"], ["`array`", "нет", "да", "в обе стороны", "фиксирован"], ["`vector`", "в конец", "да", "в обе стороны", "меняется"], ["`deque`", "в начало и конец", "да", "в обе стороны", "меняется"], ["`list`", "куда угодно", "нет", "в обе стороны", "меняется"], ["`forward_list`", "куда угодно (после позиции)", "нет", "только вперёд", "меняется"], ["`queue`, `stack`", "только по правилам модели", "нет", "нет", "меняется"]]], ["p", "- произвольный доступ: `array`, `vector`, `deque`\n- частые вставки в середину: `list`\n- нужны и индексы, и вставка в начало: `deque`"]]}, {"h": "Практикум 3.7.8: файл → список → СКО", "b": [["p", "Читаем числа из файла в `std::list<int>`, считаем показатель и дописываем результат в файл."], ["p", "- надёжное чтение: `while (file >> a) l.push_back(a);`. Вариант `while (!file.eof()) { file >> a; l.push_back(a); }` добавит последнее число дважды, если файл кончается переводом строки\n- функция из пособия считает `sqrt(Σx² / n)` — это **среднеквадратичное** значение\n- настоящее СКО — от отклонений от среднего: `sqrt(Σ(x − mean)² / n)`"], ["code", "std::list<int> l = {2, 4, 4, 4, 5, 5, 7, 9};\ndouble mean = 0;\nfor (int x : l) mean += x;\nmean /= l.size();\ndouble s = 0;\nfor (int x : l) s += (x - mean) * (x - mean);\nstd::cout << mean << \" \" << sqrt(s / l.size());"], ["out", "5 2"]]}], "t38": [{"h": "std::map", "b": [["p", "Словарь из `<map>`: пары «ключ → значение», быстрый поиск по ключу (в основе — красно-чёрное дерево)."], ["p", "- ключи **уникальны** и всегда **упорядочены** (для строк — по алфавиту, по кодам символов), а не в порядке добавления\n- элемент — пара `std::pair<const Key, T>`: `it->first` — ключ, `it->second` — значение\n- `m[key] = v` добавляет пару или **заменяет** значение\n- `m[key]` для **несуществующего** ключа **добавляет** его со значением по умолчанию (0, пустая строка). Чтобы только проверить, используют `find` или `count`\n- `m.at(key)` — с проверкой: исключение, если ключа нет"], ["tbl", [["Метод", "Результат"], ["`insert({k, v})`", "вставить, только если ключа ещё **нет** (значение не меняет)"], ["`find(k)`", "итератор на пару или `end()`"], ["`count(k)`", "0 или 1"], ["`erase(k)`", "удалить пару"], ["`size()`, `empty()`, `clear()`", ""]]], ["code", "std::map<std::string, int> m;\nm[\"One\"] = 1; m[\"Two\"] = 2; m[\"Three\"] = 3;\nm[\"One\"] = 11;\nm.insert({\"Two\", 99});\nfor (auto& p : m) std::cout << p.first << \"=\" << p.second << \" \";\nint x = m[\"Five\"];\nstd::cout << \"| \" << m.size() << \" \" << (m.find(\"Nine\") == m.end());"], ["out", "One=11 Three=3 Two=2 | 4 1"], ["p", "Подсчёт слов: `cnt[w]++` — для нового слова сначала создаётся 0."]]}, {"h": "Свой тип ключа", "b": [["p", "Словарю нужно сравнение «меньше». Для своего класса — один из двух способов:"], ["p", "- метод `bool operator<(const Key& o) const` (обязательно `const`)\n- **класс-компаратор** с `bool operator()(const K& a, const K& b) const`, передаётся третьим параметром: `std::map<K, V, Compare>`"], ["p", "Ключи `a` и `b` словарь считает **равными**, если ни `a < b`, ни `b < a`. С компаратором «по длине» строки \"a\" и \"z\" — один и тот же ключ."]]}, {"h": "std::multimap", "b": [["p", "Словарь, где **ключи могут повторяться**."], ["p", "- нет `[]` и `at` (непонятно, какое из значений вернуть); добавляют только через `insert`\n- `count(k)` — сколько пар с ключом\n- `find(k)` — первая добавленная пара с этим ключом; пары с одинаковым ключом лежат рядом, в порядке добавления\n- `erase(k)` удаляет **все** пары с ключом; одну — `erase(итератор)`\n- все значения ключа: `equal_range(k)` или цикл от `find(k)`, пока `it->first == k`"]]}], "t39": [{"h": "std::set", "b": [["p", "Множество из `<set>`: хранит только **ключи**, без значений, уникальные и упорядоченные (красно-чёр <script>
/* Аккаунты «Указателя»: вход по почте и паролю, ник, прогресс в облаке.
   Работает через REST API Firebase (Authentication + Cloud Firestore), без SDK.
   Ключи проекта задаются в config.js (window.UK_FIREBASE). Без них приложение работает локально. */
(function (root) {
  const CFG = root.UK_FIREBASE || {};
  const ON = !!(CFG.apiKey && CFG.projectId);
  const AUTH_HOST = CFG.authEmulator ? CFG.authEmulator + '/' : 'https://';
  const AUTH = AUTH_HOST + 'identitytoolkit.googleapis.com/v1/accounts:';
  const TOKEN = AUTH_HOST + 'securetoken.googleapis.com/v1/token';
  const DB = (CFG.dbEmulator || 'https://firestore.googleapis.com') + '/v1/projects/' + CFG.projectId + '/databases/' + encodeURIComponent(CFG.databaseId || '(default)') + '/documents/';
  const SKEY = 'ukazatel-session';
  const NICK_RE = /^[A-Za-z0-9_А-Яа-яЁё]{3,20}$/;

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  let ses = ON ? store.get(SKEY) : null;   // { uid, email, idToken, refreshToken, exp, nick }
  const keep = () => store.set(SKEY, ses);

  /* ---------- ошибки ---------- */
  const MSG = {
    EMAIL_EXISTS: 'Аккаунт с этой почтой уже есть. Войди или восстанови пароль.',
    EMAIL_NOT_FOUND: 'Неверная почта или пароль.',
    INVALID_PASSWORD: 'Неверная почта или пароль.',
    INVALID_LOGIN_CREDENTIALS: 'Неверная почта или пароль.',
    INVALID_EMAIL: 'Похоже, в адресе почты опечатка.',
    MISSING_EMAIL: 'Введи почту.',
    MISSING_PASSWORD: 'Введи пароль.',
    WEAK_PASSWORD: 'Пароль слишком короткий: нужно минимум 6 символов.',
    TOO_MANY_ATTEMPTS_TRY_LATER: 'Слишком много попыток. Подожди несколько минут.',
    USER_DISABLED: 'Этот аккаунт отключён.',
    NICK_BAD: 'Ник: от 3 до 20 символов, буквы, цифры и _.',
    NICK_TAKEN: 'Этот ник уже занят, придумай другой.',
    NETWORK: 'Нет связи с сервером. Проверь интернет и попробуй ещё раз.',
    OFF: 'Аккаунты пока не подключены.',
    SESSION: 'Сессия истекла, войди заново.',
    NICK_NOT_FOUND: 'Пользователя с таким ником нет. Проверь написание.',
    SELF: 'Это твой собственный ник.',
    ALREADY: 'Этот пользователь уже у тебя в друзьях.',
    NEED_LOGIN: 'Сначала войди в аккаунт.',
    // ошибки настройки проекта Firebase — их увидит тот, кто подключает сайт
    API_KEY: 'Ошибка настройки сайта: неверный apiKey в config.',
    AUTH_OFF: 'Ошибка настройки сайта: вход по почте не включён (Security → Authentication → Sign-in method → Email/Password).',
    DB_MISSING: 'Ошибка настройки сайта: база Firestore не найдена. Проверь projectId и что база создана с Database ID (default).',
    RULES: 'Ошибка настройки сайта: нет доступа к базе. Опубликуй правила из firestore.rules (Firestore → Rules → Publish).',
  };
  function classify(j, status) {
    const e = (j && j.error) || {}, m = String(e.message || ''), st = String(e.status || '');
    if (/API key not valid|API_KEY_INVALID/i.test(m)) return 'API_KEY';
    if (/CONFIGURATION_NOT_FOUND|OPERATION_NOT_ALLOWED/.test(m)) return 'AUTH_OFF';
    if (/does not exist for project|Project .* (?:not found|does not exist)|has not been used in project|is disabled|SERVICE_DISABLED/i.test(m)) return 'DB_MISSING';
    if (st === 'PERMISSION_DENIED' || /Missing or insufficient permissions/i.test(m)) return 'RULES';
    return m || st || 'HTTP_' + status;
  }
  class AccError extends Error { constructor(code) { const c = String(code || 'ERR').split(' ')[0].split(':')[0]; super(MSG[c] || 'Что-то пошло не так (' + c + '). Попробуй ещё раз.'); this.code = c; } }

  async function call(url, opt) {
    let r;
    try { r = await fetch(url, opt); } catch (e) { throw new AccError('NETWORK'); }
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      const err = new AccError(classify(j, r.status));
      err.status = r.status; err.fsStatus = j && j.error && j.error.status;
      throw err;
    }
    return j || {};
  }
  const post = (url, body) => call(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  /* ---------- сессия ---------- */
  function begin(r) {
    ses = { uid: r.localId, email: r.email, idToken: r.idToken, refreshToken: r.refreshToken, exp: Date.now() + (+r.expiresIn || 3600) * 1000, nick: null };
    keep();
  }
  async function refresh() {
    let r;
    try {
      r = await call(TOKEN + '?key=' + CFG.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(ses.refreshToken) });
    } catch (e) {
      if (e.code !== 'NETWORK') { ses = null; keep(); emit(); throw new AccError('SESSION'); }
      throw e;
    }
    ses.idToken = r.id_token; ses.refreshToken = r.refresh_token; ses.exp = Date.now() + (+r.expires_in || 3600) * 1000;
    keep();
  }
  async function token(force) {
    if (!ses) throw new AccError('SESSION');
    if (force || Date.now() > ses.exp - 120000) await refresh();
    return ses.idToken;
  }

  /* ---------- Firestore ---------- */
  async function db(method, path, body, authed = true) {
    const go = async force => {
      const headers = { 'Content-Type': 'application/json' };
      if (authed) headers.Authorization = 'Bearer ' + await token(force);
      return call(DB + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    };
    try { return await go(false); }
    catch (e) { if (authed && e.status === 401) return go(true); throw e; }
  }
  const str = v => ({ stringValue: String(v) });
  const field = (doc, k) => doc && doc.fields && doc.fields[k] ? doc.fields[k].stringValue : null;
  const nickId = n => encodeURIComponent(n.toLowerCase());

  async function nickOwner(nick) {
    try { return field(await db('GET', 'nicknames/' + nickId(nick), null, false), 'uid'); }
    catch (e) { if (e.status === 404 && e.code !== 'DB_MISSING') return null; throw e; }
  }
  const FATAL = ['NETWORK', 'SESSION', 'API_KEY', 'AUTH_OFF', 'DB_MISSING'];
  async function claimNick(nick) {
    if (!NICK_RE.test(nick)) throw new AccError('NICK_BAD');
    try {
      await db('POST', 'nicknames?documentId=' + nickId(nick), { fields: { uid: str(ses.uid), nick: str(nick) } });
    } catch (e) {
      if (FATAL.includes(e.code)) throw e;
      // документ уже есть: это либо наш ник (повторная попытка), либо чужой
      if ((await nickOwner(nick)) !== ses.uid) throw new AccError('NICK_TAKEN');
    }
  }
  async function writeUser(fields) {
    const mask = Object.keys(fields).map(k => 'updateMask.fieldPaths=' + k).join('&');
    const f = {};
    for (const k in fields) f[k] = str(fields[k]);
    f.updatedAt = { timestampValue: new Date().toISOString() };
    await db('PATCH', 'users/' + ses.uid + '?' + mask + '&updateMask.fieldPaths=updatedAt', { fields: f });
  }
  const parseList = v => { try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  async function readUser() {
    try {
      const d = await db('GET', 'users/' + ses.uid);
      let progress = null;
      try { progress = JSON.parse(field(d, 'progress')); } catch (e) {}
      ses.friends = parseList(field(d, 'friends')); keep();
      return { nick: field(d, 'nick'), progress, friends: ses.friends };
    } catch (e) { if (e.status === 404 && e.code !== 'DB_MISSING') { ses.friends = []; return { nick: null, progress: null, friends: [] }; } throw e; }
  }
  /* публичная карточка для друзей: ник и сводка прогресса, без почты и подробностей */
  async function writeProfile(stats) {
    if (!ses || !ses.nick || !stats) return;
    const f = { nick: str(ses.nick), updatedAt: { timestampValue: new Date().toISOString() } };
    for (const k in stats) f[k] = str(stats[k]);
    const mask = Object.keys(f).map(k => 'updateMask.fieldPaths=' + k).join('&');
    await db('PATCH', 'profiles/' + ses.uid + '?' + mask, { fields: f });
  }
  const docFields = d => { const o = {}; for (const k in (d && d.fields) || {}) { const v = d.fields[k]; o[k] = v.stringValue != null ? v.stringValue : v.timestampValue != null ? v.timestampValue : v.integerValue; } return o; };
  async function runQuery(structuredQuery) {
    const go = async force => call(DB.replace(/\/$/, '') + ':runQuery', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await token(force) }, body: JSON.stringify({ structuredQuery }) });
    let r;
    try { r = await go(false); } catch (e) { if (e.status === 401) r = await go(true); else throw e; }
    return (r || []).filter(x => x.document).map(x => x.document);
  }

  /* ---------- синхронизация прогресса ---------- */
  let sync = { status: 'idle', at: null }, timer = null, pending = null, listeners = [];
  const emit = () => listeners.forEach(f => { try { f(); } catch (e) {} });
  function setSync(status) { sync.status = status; if (status === 'ok') sync.at = new Date(); emit(); }
  async function flush() {
    timer = null;
    if (!ses || !pending) return;
    const data = pending; pending = null;
    setSync('saving');
    try {
      await writeUser({ progress: JSON.stringify(data) });
      if (ACC.statsFn) await writeProfile(ACC.statsFn(data));
      setSync('ok');
    }
    catch (e) {
      if (!pending) pending = data;               // сохраним при следующей возможности
      sync.msg = e.message; setSync(e.code === 'NETWORK' ? 'offline' : 'error');
    }
  }
  function push(state) {
    if (!ses) return;
    pending = state;
    if (timer) clearTimeout(timer);
    timer = setTimeout(flush, 1200);
  }
  if (typeof addEventListener === 'function') {
    addEventListener('online', () => { if (pending) flush(); });
    addEventListener('pagehide', () => { if (pending && ses) flush(); });
  }

  /* ---------- публичные действия ---------- */
  const need = () => { if (!ON) throw new AccError('OFF'); };
  const clean = s => String(s || '').trim();
  const ACC = {
    enabled: ON,
    NICK_RE,
    get user() { return ses ? { uid: ses.uid, email: ses.email, nick: ses.nick } : null; },
    get sync() { return sync; },
    onChange(f) { listeners.push(f); },

    async register(email, password, nick) {
      need(); email = clean(email); nick = clean(nick);
      if (!NICK_RE.test(nick)) throw new AccError('NICK_BAD');
      if (await nickOwner(nick)) throw new AccError('NICK_TAKEN');
      begin(await post(AUTH + 'signUp?key=' + CFG.apiKey, { email, password, returnSecureToken: true }));
      try { await claimNick(nick); await writeUser({ nick }); }
      catch (e) { emit(); e.afterSignup = true; throw e; }   // аккаунт создан, ник выберем следующим шагом
      ses.nick = nick; keep();
      post(AUTH + 'sendOobCode?key=' + CFG.apiKey, { requestType: 'VERIFY_EMAIL', idToken: ses.idToken }).catch(() => {});
      emit();
      return { nick, progress: null };
    },
    async login(email, password) {
      need();
      begin(await post(AUTH + 'signInWithPassword?key=' + CFG.apiKey, { email: clean(email), password, returnSecureToken: true }));
      const u = await readUser();
      ses.nick = u.nick; keep(); emit();
      return u;
    },
    async reset(email) {
      need();
      await post(AUTH + 'sendOobCode?key=' + CFG.apiKey, { requestType: 'PASSWORD_RESET', email: clean(email) });
    },
    async pull() {
      if (!ses) return null;
      const u = await readUser();
      if (u.nick !== ses.nick) { ses.nick = u.nick; keep(); emit(); }
      return u;
    },
    async setNick(nick) {
      need(); nick = clean(nick);
      const old = ses.nick;
      if (old === nick) return;
      await claimNick(nick);
      await writeUser({ nick });
      ses.nick = nick; keep(); emit();
      if (ACC.statsFn && ses) writeProfile(ACC.statsFn()).catch(() => {});
      if (old && old.toLowerCase() !== nick.toLowerCase()) db('DELETE', 'nicknames/' + nickId(old)).catch(() => {});
    },
    push,
    flush,
    statsFn: null,
    get friends() { return ses && ses.friends ? ses.friends.slice() : []; },
    async addFriend(nick) {
      need(); if (!ses) throw new AccError('NEED_LOGIN');
      nick = clean(nick);
      if (!NICK_RE.test(nick)) throw new AccError('NICK_BAD');
      const uid = await nickOwner(nick);
      if (!uid) throw new AccError('NICK_NOT_FOUND');
      if (uid === ses.uid) throw new AccError('SELF');
      const list = ses.friends || [];
      if (list.includes(uid)) throw new AccError('ALREADY');
      ses.friends = list.concat(uid); keep();
      await writeUser({ friends: JSON.stringify(ses.friends) });
      // уведомление для друга: «тебя добавили» — он сможет добавить в ответ
      db('POST', 'requests?documentId=' + uid + '_' + ses.uid, { fields: { from: str(ses.uid), to: str(uid), fromNick: str(ses.nick || '') } }).catch(() => {});
      db('DELETE', 'requests/' + ses.uid + '_' + uid).catch(() => {});
      emit();
      return uid;
    },
    async removeFriend(uid) {
      need(); if (!ses) throw new AccError('NEED_LOGIN');
      ses.friends = (ses.friends || []).filter(x => x !== uid); keep();
      await writeUser({ friends: JSON.stringify(ses.friends) });
      emit();
    },
    async profiles(uids) {
      if (!ses) return [];
      return Promise.all(uids.map(async uid => {
        try { return Object.assign({ uid }, docFields(await db('GET', 'profiles/' + uid))); }
        catch (e) { if (e.status === 404) return { uid, missing: true }; return { uid, error: e.message }; }

    async dismiss(fromUid) { if (ses) await db('DELETE', 'requests/' + ses.uid + '_' + fromUid).catch(() => {}); },
    async publishProfile(stats) { await writeProfile(stats); },
    async saveNow(state) { pending = state; if (timer) clearTimeout(timer); await flush(); },
    logout() { if (timer) clearTimeout(timer); timer = null; pending = null; ses = null; keep(); sync = { status: 'idle', at: null }; emit(); },
  };
  root.ACC = ACC;
})(window);

// Свои звуки хранятся в IndexedDB этого браузера; заранее создаём <audio>, чтобы iOS разрешил запуск по нажатию
const SND = { list: [], audio: {}, url: {}, ok: true };
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('ukazatel', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('sounds')) r.result.createObjectStore('sounds', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
function idbDo(mode, fn) {
  return idb().then(d => new Promise((res, rej) => {
    const tx = d.transaction('sounds', mode), st = tx.objectStore('sounds'), q = fn(st);
    tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  }));
}
function sndPrepare(rec) {
  try {
    const url = URL.createObjectURL(rec.blob);
    const a = new Audio(); a.preload = 'auto'; a.src = url;
    SND.url[rec.id] = url; SND.audio[rec.id] = a;
  } catch (e) {}
}
function sndInit() {
  return idbDo('readonly', st => st.getAll()).then(list => {
    SND.list = (list || []).sort((a, b) => a.added - b.added).map(r => ({ id: r.id, name: r.name, size: r.size }));
    (list || []).forEach(sndPrepare);
  }).catch(() => { SND.ok = false; });
}
async function sndAdd(file) {
  if (!/^audio\//.test(file.type) && !/\.(mp3|m4a|aac|wav|ogg|oga|opus|webm|flac)$/i.test(file.name)) throw new Error('Это не аудиофайл. Подойдут mp3, m4a, wav, ogg.');
  if (file.size > 3 * 1024 * 1024) throw new Error('Файл больше 3 МБ. Возьми короткий фрагмент на пару секунд.');
  if (SND.list.length >= 10) throw new Error('Можно добавить до 10 звуков. Удали ненужные.');
  const rec = { id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: file.name.replace(/\.[^.]+$/, '').slice(0, 40), size: file.size, added: Date.now(), blob: file };
  await idbDo('readwrite', st => st.put(rec));
  SND.list.push({ id: rec.id, name: rec.name, size: rec.size });
  sndPrepare(rec);
  return rec.id;
}
async function sndDelete(id) {
  await idbDo('readwrite', st => st.delete(id));
  SND.list = SND.list.filter(x => x.id !== id);
  if (SND.audio[id]) { SND.audio[id].pause(); delete SND.audio[id]; }
  if (SND.url[id]) { URL.revokeObjectURL(SND.url[id]); delete SND.url[id]; }
  if (SET.pick === id) { SET.pick = SND.list.length ? 'random' : 'builtin'; saveSet(); }
}
let actx = null;
function chime() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = t0 + i * 0.11, len = i === 3 ? 0.55 : 0.18;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.05);
    });
  } catch (e) {}
}
function playSound(id) {
  let a = null;
  if (id === 'random' && SND.list.length) a = SND.audio[SND.list[Math.floor(Math.random() * SND.list.length)].id];
  else if (id && id !== 'builtin') a = SND.audio[id];
  if (!a) return chime();
  try { a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => chime()); } catch (e) { chime(); }
}

      check() {
        ans.dataset.lock = '1';
        const ok = picked.map(j => t.lines[j].trim()).join('\n') === t.lines.map(s => s.trim()).join('\n');
        ans.querySelectorAll('.tile').forEach(b => b.disabled = true); Object.values(tiles).forEach(b => b.disabled = true);
        ans.classList.add(ok ? 'right' : 'wrong');
        return { ok, ans: `<pre class="code">${hl(t.lines.join('\n'))}</pre>` };
      }
    };
  },
};

/* ===================== УРОК ===================== */
let S = null;
const PRAISE = ['Отлично!', 'Верно!', 'Так держать!', 'Точно в цель!', 'Компилируется!', 'Без единого warning!'];
function startLesson(l) {
  S = { l, queue: l.tasks.slice(), pos: 0, hearts: 5, correct: 0, total: l.tasks.length, missed: new Set(), t0: Date.now(), phase: 'answer', cur: null };
  app.hidden = true;
  const root = h('div', { class: 'lesson', id: 'lesson' });
  root.append(
    h('div', { class: 'lbar' }, h('div', { class: 'wrap' },
      h('button', { class: 'x', 'aria-label': 'Выйти из урока', onclick: askExit, html: IC.close }),
      THEORY[l.unit.id] ? h('button', { class: 'x bk', 'aria-label': 'Теория темы', title: 'Теория темы', onclick: () => theoryView(l.unit, true), html: IC.book }) : null,
      h('div', { class: 'prog', role: 'progressbar', 'aria-label': 'Прогресс урока' }, h('i')),
      h('div', { class: 'hearts', 'aria-label': 'Жизни' }, icon('heart'), h('span', { id: 'hn' }, '5')))),
    h('div', { class: 'lbody' }, h('div', { class: 'wrap', id: 'lb' })),
    h('div', { class: 'lfoot', id: 'lf' }, h('div', { class: 'wrap' },
      h('div', { class: 'fb', id: 'fb', hidden: true }),
      h('button', { class: 'btn wide', id: 'go', disabled: true, onclick: onGo }, 'Проверить'))));
  document.body.append(root);
  window.scrollTo(0, 0);
  renderTask();
}
function askExit() {
  openSheet([h('h3', null, 'Выйти из урока?'), h('p', null, 'Прогресс этого урока не сохранится.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: closeSheet }, 'Продолжить урок'),
      h('button', { class: 'btn ghost', onclick: () => { closeSheet(); endLesson(); } }, 'Выйти'))]);
}
function endLesson() { const r = document.getElementById('lesson'); r && r.remove(); S = null; renderHome(); window.scrollTo(0, 0); }
function setProg() {
  const w = S.pr ? S.unitSolved() / S.unitTotal * 100 : S.correct / S.total * 100;
  document.querySelector('.prog i').style.width = w + '%';
  if (S.pr) document.getElementById('pn').textContent = S.unitSolved() + '/' + S.unitTotal;
}
function renderTask() {
  const t = S.queue[S.pos];
  const lb = document.getElementById('lb'); lb.innerHTML = '';
  const again = S.missed.has(t);
  const [kname, kic] = KIND[t.type];
  if (t.type === 'theory') t.unitRef = t.ref || S.l.unit.ref;
  lb.append(h('div', { class: 'kind' + (again ? ' again' : '') + (t.type === 'theory' ? ' th' : '') }, icon(again ? 'redo' : kic), again ? 'Ещё раз: работа над ошибкой' : kname),
    t.src ? h('div', { class: 'src-badge' }, icon('book'), t.src) : null,
    h('h2', { class: 'prompt', html: md(t.prompt || t.title || '') }));
  const go = document.getElementById('go');
  S.cur = R[t.type](t, ok => { if (S.phase === 'answer') go.disabled = !ok; });
  lb.append(...[S.cur.el].flat().filter(Boolean));
  const lf = document.getElementById('lf'); lf.className = 'lfoot';
  document.getElementById('fb').hidden = true;
  S.phase = 'answer';
  if (t.type === 'theory') { go.textContent = 'Понятно'; go.disabled = false; }
  else { go.textContent = 'Проверить'; go.disabled = true; }
  const sk = document.getElementById('skip'); if (sk) sk.hidden = false;
  window.scrollTo(0, 0);
  setProg();
}
function next() {
  if (S.pr) { S.pos++; return S.pos >= S.queue.length ? practiceDone() : renderTask(); }
  if (S.hearts === 0) return showResult(false);
  S.pos++;
  if (S.pos >= S.queue.length) return showResult(true);
  renderTask();
}
function onGo() {
  const go = document.getElementById('go');
  if (go.disabled) return;
  const t = S.queue[S.pos];
  if (t.type === 'theory' && S.phase === 'answer') { S.correct++; return next(); }
  if (S.phase === 'answer') {
    const res = S.cur.check();
    const lf = document.getElementById('lf'), fb = document.getElementById('fb');
    fb.innerHTML = '';
    if (res.ok) {
      if (S.pr && !state.pr[t.id]) { state.pr[t.id] = true; state.xpDev[DEV] = (state.xpDev[DEV] || 0) + 5; state.xp += 5; S.gained += 5; touchStreak(); save(); }
      S.correct++;
      fb.append(h('h4', null, icon('check'), PRAISE[Math.floor(Math.random() * PRAISE.length)]));
      if (res.label) fb.append(h('div', { class: 'lab', style: 'color:var(--green-d)' }, res.label), h('div', { html: res.ans }));
    } else {
      if (S.pr) { S.missed.add(t); S.queue.push(t); }
      else {
        S.hearts--; S.missed.add(t); S.queue.push(t);
        document.getElementById('hn').textContent = S.hearts;
        const hs = document.querySelector('.hearts'); hs.classList.remove('hit'); void hs.offsetWidth; hs.classList.add('hit');
      }
      fb.append(h('h4', null, icon('cross'), 'Не совсем'), h('div', { class: 'lab' }, 'Правильный ответ:'), h('div', { html: res.ans }));
      const lb = document.getElementById('lb'); lb.classList.remove('shake'); void lb.offsetWidth; lb.classList.add('shake');
    }
    fb.append(h('p', { html: md(t.explain) }));
    if (S.pr && !res.ok && (t.type === 'code' || t.type === 'fix')) {
      const cr = h('button', { class: 'linkbtn credit', onclick: () => {
        if (S.queue[S.queue.length - 1] === t) S.queue.pop();
        if (!state.pr[t.id]) { state.pr[t.id] = true; state.xpDev[DEV] = (state.xpDev[DEV] || 0) + 5; state.xp += 5; S.gained += 5; touchStreak(); save(); }
        cr.replaceWith(h('div', { class: 'lab' }, 'Засчитано. Проверка сравнивает код с эталонами и может не знать твой вариант.'));
        setProg();
      } }, 'Мой вариант тоже верный — засчитать');
      fb.append(cr);
    }
    fb.hidden = false;
    lf.className = 'lfoot ' + (res.ok ? 'ok' : 'bad');
    go.textContent = !S.pr && S.hearts === 0 ? 'Завершить' : 'Дальше';
    const sk = document.getElementById('skip'); if (sk) sk.hidden = true;
    S.phase = 'next'; setProg(); go.focus();
  } else next();
}
function showResult(win) {
  const sec = Math.round((Date.now() - S.t0) / 1000);
  const time = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  const gr = graded(S.l);
  const firstTry = gr - S.missed.size;
  const acc = gr ? Math.round(firstTry / gr * 100) : 100;
  const root = document.getElementById('lesson'); root.innerHTML = '';
  const wrap = h('div', { class: 'wrap', style: 'flex:1;display:flex;flex-direction:column;width:100%;box-sizing:border-box' });
  if (win) {
    const xp = 10 + firstTry * 2;
    state.xpDev[DEV] = (state.xpDev[DEV] || 0) + xp; state.xp += xp; state.done[S.l.id] = true;
    touchStreak();
    save();
    if (acc === 100) playWin();
    wrap.append(h('div', { class: 'result' },
      h('div', { class: 'big pop' }, icon('star')),
      h('h2', null, acc === 100 ? 'Идеально, без ошибок!' : 'Урок пройден!'),
      h('p', null, `${S.l.title} · серия ${state.streak} ${plural(state.streak, 'день', 'дня', 'дней')}`),
      h('div', { class: 'tiles' },
        stat('Опыт', '+' + xp, '--gold'), stat('Точность', acc + '%', '--green'), stat('Время', time, '--blue')),
      h('button', { class: 'btn wide', onclick: endLesson }, 'Продолжить')));
  } else {
    const l = S.l;
    wrap.append(h('div', { class: 'result fail' },
      h('div', { class: 'big' }, icon('heart')),
      h('h2', null, 'Жизни закончились'),
      h('p', null, 'Ничего страшного: ошибки здесь для того, чтобы на них учиться. Разборы ты уже видел, попробуй ещё раз.'),
      h('div', { class: 'row', style: 'display:flex;gap:10px;flex-wrap:wrap' },
        h('button', { class: 'btn', style: 'flex:1 1 160px', onclick: () => { root.remove(); startLesson(l); } }, 'Ещё раз'),
        h('button', { class: 'btn ghost', style: 'flex:1 1 160px', onclick: endLesson }, 'На карту'))));
  }
  root.append(wrap);
  window.scrollTo(0, 0);
  const b = root.querySelector('.btn'); b && b.focus();
}
const stat = (k, v, c) => h('div', { class: 'st', style: `--c:var(${c})` }, h('div', { class: 'h' }, k), h('div', { class: 'v' }, v));
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

document.addEventListener('keydown', e => {
  if (readerEl) { if (e.key === 'Escape') closeReader(); return; }
  if (e.key === 'Escape' && sheetEl) { closeSheet(); return; }
  if (!S || sheetEl) return;
  const tag = e.target.tagName;
  if (e.key === 'Enter' && tag === 'TEXTAREA') { if (e.ctrlKey || e.metaKey) { e.preventDefault(); onGo(); } return; }
  if (e.key === 'Enter' && tag !== 'BUTTON') { e.preventDefault(); onGo(); }
  else if (/^[1-6]$/.test(e.key) && S.phase === 'answer' && S.cur.key && tag !== 'INPUT' && tag !== 'TEXTAREA') S.cur.key(e.key);
});
/* без этого :active-нажатия не видны в iOS Safari */
document.addEventListener('touchstart', () => {}, { passive: true });
renderHome();
startAccount();
sndInit();

</script>
