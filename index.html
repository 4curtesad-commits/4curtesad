<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2DB463">
<title>Указатель</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column; home = vertical zigzag path of lesson nodes grouped by unit bands; lesson = full-screen task with a sticky check bar */
:root{
  --bg:#F8FBF9; --surface:#FFFFFF; --ink:#1E2925; --muted:#6A7a74; --line:#E1E8E4; --line-d:#C9D3CE;
  --green:#2DB463; --green-d:#1E8A49; --soft-green:#E3F6EA;
  --red:#E5484D; --red-d:#B5333A; --soft-red:#FCEBEC;
  --blue:#2F86E0; --blue-d:#1F63AD; --soft-blue:#E6F1FC;
  --violet:#8A5CF0; --violet-d:#6A3FCE;
  --gold:#F2A31B; --gold-d:#C67F06;
  --on-accent:#FFFFFF;
  --code-bg:#F2F6F4;
  --t-k:#8A3BC9; --t-s:#B2531A; --t-n:#1C78BF; --t-c:#8C9893; --t-p:#C2357A;
  --font-ui:"Nunito", "Segoe UI", system-ui, sans-serif;
  --font-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --ink:#E7EFEB; --muted:#93A39D; --line:#28342F; --line-d:#1C2522;
  --green:#38C672; --green-d:#218C4C; --soft-green:#15301F;
  --red:#F0676C; --red-d:#B33A40; --soft-red:#3A1D1F;
  --blue:#4C9BEF; --blue-d:#2B6CB2; --soft-blue:#16283C;
  --violet:#9D78F7; --violet-d:#6F4AD3;
  --gold:#F5B240; --gold-d:#B97A0E;
  --on-accent:#FFFFFF; --code-bg:#0E1412;
  --t-k:#C79CFF; --t-s:#F0A274; --t-n:#6DB7F3; --t-c:#6C7B75; --t-p:#F27BB2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --ink:#E7EFEB; --muted:#93A39D; --line:#28342F; --line-d:#1C2522;
  --green:#38C672; --green-d:#218C4C; --soft-green:#15301F;
  --red:#F0676C; --red-d:#B33A40; --soft-red:#3A1D1F;
  --blue:#4C9BEF; --blue-d:#2B6CB2; --soft-blue:#16283C;
  --violet:#9D78F7; --violet-d:#6F4AD3;
  --gold:#F5B240; --gold-d:#B97A0E;
  --on-accent:#FFFFFF; --code-bg:#0E1412;
  --t-k:#C79CFF; --t-s:#F0A274; --t-n:#6DB7F3; --t-c:#6C7B75; --t-p:#F27BB2;
  color-scheme:dark;
}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.tile,.opt,.node,.bl,.slot{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
code,.mono{font-family:var(--font-code)}
.ic svg{display:block;width:100%;height:100%;fill:currentColor}

.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--green)}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--green);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 3px 0 var(--green-d);font-family:var(--font-code);font-weight:700;font-size:18px}
.stats{display:flex;gap:16px;font-weight:800}
.stat{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.stat .ic{width:22px;height:22px}
.stat.fire{color:var(--gold)} .stat.fire.off{color:var(--muted)}
.stat.xp{color:var(--blue)}
.overall{color:var(--muted);font-weight:700;font-size:14px;padding-block:14px 0}
.overall b{color:var(--ink)}

/* units */
.unit{--u:var(--green);--ud:var(--green-d);margin-top:20px}
.unit-head{background:var(--u);color:var(--on-accent);border-radius:16px;padding:16px 20px;box-shadow:0 4px 0 var(--ud)}
.unit-head .eb{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.unit-head h2{margin:2px 0 4px;font-size:22px;font-weight:900;text-wrap:balance}
.unit-head p{margin:0;font-weight:700;opacity:.92;font-size:15px}
.unit-head .meta{margin-top:10px;font-size:13px;font-weight:800;opacity:.9;font-variant-numeric:tabular-nums}
.part{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:34px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.part h2{margin:0;font-size:24px;font-weight:900;text-wrap:balance}
.part span{color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:30px 14px}
.nw{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:68px;border-radius:50%;border:none;background:var(--u);color:var(--on-accent);box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;transition:transform .08s}
.node .ic{width:32px;height:32px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.nw.done .node{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.nw.lock .node,.nw.soon .node{background:var(--line);color:var(--muted);box-shadow:0 7px 0 var(--line-d)}
.nw.soon .node{font-weight:900;font-size:13px}
.nw .lbl{margin-top:12px;font-size:13px;font-weight:800;color:var(--muted);max-width:150px;text-align:center;line-height:1.25}
.nw.cur .lbl{color:var(--ink)}
.nw.cur::before{content:"";position:absolute;top:-8px;width:90px;height:84px;border-radius:50%;border:4px solid var(--u);opacity:.35;pointer-events:none}
.bubble{position:absolute;top:-46px;background:var(--surface);color:var(--u);border:2px solid var(--line);font-weight:900;font-size:14px;letter-spacing:.06em;padding:7px 13px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.foot-note{color:var(--muted);font-size:13px;font-weight:700;text-align:center;padding-block:28px 40px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:15px 22px;font-weight:900;font-size:15px;letter-spacing:.07em;text-transform:uppercase;background:var(--green);color:var(--on-accent);box-shadow:0 4px 0 var(--green-d);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-d);cursor:default}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:600px;background:var(--surface);border-radius:20px 20px 0 0;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.sheet .eb{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--u,var(--muted))}
.sheet h3{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);font-weight:700;line-height:1.45}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1 1 160px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:.4}}

/* lesson */
/* in-flow screen with sticky bars: works both in a fixed-height and an auto-height frame (iOS WebView) */
.lesson{min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.lbar{position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg)}
.lbar .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.x{width:34px;height:34px;border:none;background:none;color:var(--muted);padding:4px;flex:none}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s ease;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.hearts{display:flex;align-items:center;gap:5px;color:var(--red);font-weight:900;font-variant-numeric:tabular-nums;flex:none}
.hearts .ic{width:24px;height:24px}
.hearts.hit{animation:pulse .4s}
@keyframes pulse{40%{transform:scale(1.3)}}
.lbody{flex:1 0 auto}
.lbody .wrap{padding-block:12px 28px;display:flex;flex-direction:column;gap:18px}
.kind{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.kind .ic{width:20px;height:20px}
.kind.again{color:var(--gold-d)}
.prompt{margin:0;font-size:22px;font-weight:900;line-height:1.25;text-wrap:balance}
.prompt code,.fb code,.sheet code{font-size:.85em;background:var(--code-bg);border:1px solid var(--line);padding:1px 5px;border-radius:6px}

.code{margin:0;background:var(--code-bg);border:2px solid var(--line);border-radius:14px;padding:14px 16px;overflow-x:auto;font:500 14px/1.65 var(--font-code);white-space:pre;tab-size:4}
.t-k{color:var(--t-k);font-weight:700} .t-s{color:var(--t-s)} .t-n{color:var(--t-n)} .t-c{color:var(--t-c);font-style:italic} .t-p{color:var(--t-p);font-weight:700}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-weight:700;font-size:16px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted)}
.opt.mono span{font-family:var(--font-code);font-size:14px}
.opt.sel{border-color:var(--blue);background:var(--soft-blue);color:var(--blue-d)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--soft-green)}
.opt.wrong{border-color:var(--red);background:var(--soft-red)}
.opt:disabled{cursor:default}

.out-in{width:100%;box-sizing:border-box;font:500 17px var(--font-code);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.out-in:focus{outline:none;border-color:var(--blue)}
.out-in.right{border-color:var(--green);background:var(--soft-green)}
.out-in.wrong{border-color:var(--red);background:var(--soft-red)}

.slot{display:inline-block;min-width:3.4em;min-height:1.4em;vertical-align:bottom;text-align:center;border:none;border-bottom:2px solid var(--muted);background:transparent;font:inherit;color:var(--ink);padding:0 6px;margin:0 2px;border-radius:0}
.slot.f{border:2px solid var(--line);border-bottom-width:3px;border-radius:8px;background:var(--surface);font-weight:700}
.slot.right{border-color:var(--green);background:var(--soft-green)}
.slot.wrong{border-color:var(--red);background:var(--soft-red)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:6px}
.tile{font:700 15px var(--font-code);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 15px;color:var(--ink)}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);cursor:default}
.bank.col{flex-direction:column;align-items:stretch}
.bank.col .tile,.ans .tile{text-align:left;white-space:pre;overflow-x:auto;font-size:14px}
.ans{min-height:120px;border:2px dashed var(--line-d);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ans:empty::before{content:"Нажимай на строки ниже по порядку";color:var(--muted);font-weight:700;font-size:14px;margin:auto}
.ans.right{border-style:solid;border-color:var(--green);background:var(--soft-green)}
.ans.wrong{border-style:solid;border-color:var(--red);background:var(--soft-red)}

.buglist{background:var(--code-bg);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.bl{display:flex;align-items:baseline;text-align:left;background:transparent;border:2px solid transparent;border-radius:10px;padding:5px 8px;font:500 14px/1.5 var(--font-code);min-width:max-content}
.bl .ln{color:var(--t-c);width:2.2ch;margin-right:12px;text-align:right;flex:none;user-select:none}
.bl .tx{white-space:pre}
.bl:hover:not(:disabled){background:var(--surface)}
.bl.sel{border-color:var(--blue);background:var(--soft-blue)}
.bl.right{border-color:var(--green);background:var(--soft-green)}
.bl.wrong{border-color:var(--red);background:var(--soft-red)}
.bl:disabled{cursor:default}

.lfoot{position:-webkit-sticky;position:sticky;bottom:0;z-index:3;border-top:2px solid var(--line);background:var(--bg);transition:background .15s}
.lfoot .wrap{padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.lfoot.ok{background:var(--soft-green);border-color:transparent}
.lfoot.bad{background:var(--soft-red);border-color:transparent}
.fb{display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow-y:auto}
.fb h4{margin:0;font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.fb h4 .ic{width:26px;height:26px;padding:3px;border-radius:50%;color:var(--on-accent)}
.lfoot.ok .fb h4{color:var(--green-d)} .lfoot.ok .fb h4 .ic{background:var(--green)}
.lfoot.bad .fb h4{color:var(--red-d)} .lfoot.bad .fb h4 .ic{background:var(--red)}
.fb .lab{font-weight:900;font-size:14px;color:var(--red-d)}
.fb p{margin:0;font-weight:700;line-height:1.45;font-size:15px}
.fb .code{font-size:13px;padding:10px 12px}
.lfoot.ok .btn{background:var(--green)} .lfoot.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}

.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.03)}}

/* result */
.result{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center;padding-block:30px}
.result .big{width:110px;height:110px;margin:0 auto;border-radius:30px;display:grid;place-items:center;color:var(--on-accent);background:var(--gold);box-shadow:0 8px 0 var(--gold-d)}
.result .big .ic{width:62px;height:62px}
.result.fail .big{background:var(--red);box-shadow:0 8px 0 var(--red-d)}
.result h2{margin:0;font-size:30px;font-weight:900;color:var(--gold-d);text-wrap:balance}
.result.fail h2{color:var(--red)}
.result p{margin:0;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{border:2px solid var(--c);border-radius:14px;overflow:hidden;background:var(--c)}
.st .h{color:var(--on-accent);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:6px 4px}
.st .v{background:var(--surface);border-radius:11px;padding:12px 4px;font-size:22px;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums}


/* theory card */
.kind.th{color:var(--blue-d)}
.thcard{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;line-height:1.5;font-weight:700;font-size:16px}
.thcard p{margin:0}
.thcard ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.thcard code{font-family:var(--font-code);font-size:.86em;background:var(--code-bg);border:1px solid var(--line);padding:1px 5px;border-radius:6px}
.thcard .code{font-size:13.5px}
.thref{font-size:13px;font-weight:800;color:var(--muted)}

/* typed code */
.blank{font:600 16px var(--font-code);color:var(--ink);background:var(--surface);border:2px solid var(--line-d);border-radius:8px;padding:1px 6px;margin:0 2px;vertical-align:baseline;box-sizing:content-box;-webkit-appearance:none;appearance:none}
.blank:focus{outline:none;border-color:var(--blue)}
.blank.right{border-color:var(--green);background:var(--soft-green)}
.blank.wrong{border-color:var(--red);background:var(--soft-red)}
.code-in{display:block;width:100%;box-sizing:border-box;min-height:120px;font:500 16px/1.55 var(--font-code);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;tab-size:4;-webkit-appearance:none;appearance:none}
.code-in:focus{outline:none;border-color:var(--blue)}
.code-in.right{border-color:var(--green);background:var(--soft-green)}
.code-in.wrong{border-color:var(--red);background:var(--soft-red)}
.hint{font-size:13px;font-weight:700;color:var(--muted);margin-top:-8px}

/* topic index */
.top .tools{display:flex;align-items:center;gap:14px}
.idx-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.sheet.tall{max-height:82vh;overflow-y:auto}
.toc{display:flex;flex-direction:column;gap:4px}
.toc h4{margin:12px 0 4px;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toc button{display:flex;align-items:center;gap:12px;text-align:left;border:none;background:transparent;border-radius:12px;padding:9px 10px;font-weight:800;font-size:15px;color:var(--ink)}
.toc button:hover{background:var(--code-bg)}
.toc .n{flex:none;min-width:2.2em;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.toc .t{flex:1;min-width:0}
.toc .p{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc .p.full{color:var(--gold-d)}
.unit-head .ref{display:inline-block;margin-top:8px;font-size:12px;font-weight:900;letter-spacing:.06em;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:8px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* аккаунт */
.acc-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;color:var(--blue);box-shadow:0 3px 0 var(--line);white-space:nowrap}
.acc-btn.in{width:36px;height:36px;padding:0;border-radius:50%;border:none;background:var(--violet);color:var(--on-accent);box-shadow:0 3px 0 var(--violet-d);font-size:16px;display:grid;place-items:center}
.acc-form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:900;font-size:14px}
.fld-in{font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.fld-in:focus{outline:none;border-color:var(--blue)}
.fld-note{color:var(--muted);font-weight:700;font-size:13px}
.form-msg{border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;line-height:1.4}
.form-msg.bad{background:var(--soft-red);color:var(--red-d)}

<script>
/* Проверка ответов «Указателя». Один и тот же файл используют приложение и скрипт проверки заданий. */
(function (root) {
  // iOS и Android подменяют кавычки и тире на типографские — приводим к обычным
  function plain(s) {
    return String(s == null ? '' : s)
      .replace(/[“”„«»″]/g, '"')
      .replace(/[‘’‚′`]/g, "'")
      .replace(/[–—−]/g, '-')
      .replace(/[   ]/g, ' ')
      .replace(/…/g, '...');
  }
  // Сравнение вывода программы: переносы и лишние пробелы не важны
  function norm(s) { return plain(s).replace(/\s+/g, ' ').trim(); }
  // Сравнение кода: пробел остаётся только между двумя «словами» (int x), остальные убираются
  function ncode(s) {
    var parts = plain(s).split(/\s+/), out = '';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!p) continue;
      if (out && /\w$/.test(out) && /^\w/.test(p)) out += ' ';
      out += p;
    }
    // «;» в конце не важен, кроме директив препроцессора: #define X 17; — ошибка
    return /^#/.test(out) ? out : out.replace(/;+$/, '');
  }
  function okBlank(input, variants) {
    var v = ncode(input);
    if (!v) return false;
    variants = [].concat(variants);
    for (var i = 0; i < variants.length; i++) if (ncode(variants[i]) === v) return true;
    return false;
  }
  function okCode(input, t) {
    var v = ncode(input);
    if (!v) return false;
    var acc = t.accept || [];
    for (var i = 0; i < acc.length; i++) if (ncode(acc[i]) === v) return true;
    var re = t.re || [];
    for (var j = 0; j < re.length; j++) if (new RegExp(re[j]).test(v)) return true;
    return false;
  }
  root.UK = { plain: plain, norm: norm, ncode: ncode, okBlank: okBlank, okCode: okCode };
})(typeof window !== 'undefined' ? window : global);

</script>

 { id: 't2-4', title: 'Сдвиги и составное присваивание', tasks: [
  th('Сдвиги и операции «с присваиванием»', C`Сдвиг переносит биты влево или вправо: ` + '`00001111 << 2 → 00111100`' + `, ` + '`00001111 >> 2 → 00000011`' + `. Сдвиг влево на k для неотрицательных чисел — умножение на 2 в степени k.

У большинства бинарных операций есть вариант с присваиванием: ` + '`*= /= %= += -= <<= >>= &= |= ^=`' + `. Например, ` + '`a += b`' + ` — то же, что ` + '`a = a + b`' + `.`,

 { id: 't5-3', title: 'Возврат значения', tasks: [
  th('Варианты возврата из функции', C`Из лабы 1.11.5, все функции получают аргумент по указателю:

- ` + '`int f2(int* a)`' + ` возвращает **копию** значения

  { type: 'output', prompt: 'Что выведет программа?', code: C`int* f4(int* a) { return a; }

  th('Как пишут функции в лабораторных', C`Упражнения пособия часто требуют, чтобы функция **ничего не выводила на экран и не запрашивала у пользователя**. Хорошая функция получает данные через аргументы и возвращает результат. Ввод и вывод делает ` + '`main`' + `.`),

  th('Имя массива как указатель', C`Имя массива компилятор понимает как указатель на первый элемент. Адрес i-го элемента: ` + '`arr + i*sizeof(type)`' + `. Поэтому ` + '`*(ptr + 2)`' + ` и ` + '`ptr[2]`' + ` — одно и то же.

  th('Направление сортировки через функцию', `Тип указателя на функцию длинный, поэтому для него часто вводят псевдоним через ${q('typedef')}. Указатель можно передать в функцию: например, ${q('Sort')} сравнивает элементы через ${q('cmpFun')}, и направление сортировки меняется заменой функции сравнения.`,

 { id: 't14-4', title: 'Утечки и висячие указатели', tasks: [
  th('Типичные ошибки', `**Утечка памяти** — участок, выделенный программой, который нельзя ни использовать, ни освободить, потому что адрес потерян. Классический пример — записать в указатель адрес литерала поверх адреса из ${q('malloc')}.

Статический массив лежит в стеке, поэтому вернуть его из функции нельзя. Динамический — можно.`,
  C`char* ptr = (char*)malloc(10);   // ptr = 0xAABBCCDD
ptr = (char*)"qwerty";            // адрес 0xAABBCCDD утерян`),
  { type: 'choice', prompt: 'Что происходит в этом фрагменте?', code: C`char* ptr = (char*)malloc(10);
ptr = (char*)"qwerty";`, options: ['Утечка: адрес выделенного блока потерян', 'Строка скопировалась в выделенную память', 'Ошибка компиляции', 'Ничего плохого'], answer: 0,
    explain: '`=` скопировал только адрес литерала. Скопировать символы можно через `strcpy(ptr, "qwerty")`.' },
  { type: 'choice', prompt: 'Какую функцию можно безопасно использовать?', options: ['`int* make(int n) { return new int[n]; }`', '`int* make() { int a[5]; return a; }`', '`int& make() { int x = 1; return x; }`', '`char* make() { char s[] = "hi"; return s; }`'], answer: 0,
    explain: 'Динамическая память живёт до `delete[]`, а локальные массивы исчезают при выходе из функции.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`int* makeSquares(int n) {
    int* arr = new int[n];
    for (int i = 0; i < n; i++) arr[i] = i * i;
    return arr;
}
int main() {
    int* sq = makeSquares(5);
    std::cout << sq[4];
    delete[] sq;
}`, answer: '16', explain: 'Функция вернула адрес динамического массива. Освобождает его вызывающий код.' },
  { type: 'order', prompt: 'Собери аккуратную работу с динамическим массивом', lines: L(C`int n = 5;
int* arr = new int[n];
for (int i = 0; i < n; i++) arr[i] = i;
std::cout << arr[n - 1];
delete[] arr;
arr = nullptr;`), out: '4', explain: 'Выделить, использовать, освободить, обнулить указатель — защита от повторного использования.' },
  { type: 'input', prompt: 'Функция выделяет память и отдаёт её через указатель на указатель', code: C`void fill(int** p, int n) {

}
int main() {
    int* a = nullptr;
    fill(___a, 3);
    std::cout << a[2];
    delete[] a;
}`, answer: [['&']], out: '7', explain: 'Так сделано в `fillArray(Item **a, ...)` из задания 2.15.7: чтобы функция изменила сам указатель, ей передают его адрес.' },
  { type: 'code', prompt: 'Освободи массив `arr` (выделен через `new[]`) и обнули указатель — две команды', rows: 2,
    accept: ['delete[] arr; arr = nullptr;'], re: [C`^delete\[\]arr;arr=(nullptr|NULL|0)$`],
    alts: ['delete[] arr;\narr = NULL;'], bad: ['delete arr; arr = nullptr;', 'arr = nullptr; delete[] arr;', 'free(arr); arr = nullptr;'],
    wrap: 'int* arr = new int[3];\n{{}}\nstd::cout << (arr == nullptr);', out: '1',
    explain: 'Если обнулить указатель раньше, адрес потеряется — получится утечка.' },
 ]},
]},

{ id: 't15', ...B, ref: '§2.5.1–2.5.3, задание 2.15.5', title: 'Перечисления и структуры', sub: 'enum, struct, . и ->, выравнивание, методы', lessons: [
 { id: 't15-1', title: 'Перечисления enum', tasks: [
  th('enum', `**Перечисление** — тип с набором именованных констант. Значение хранится как целое число. По умолчанию значения идут с 0 по возрастанию. Можно задать их явно: элемент без значения получит «левое значение + 1». Значения могут повторяться, имена — нет.`,
  C`enum Auto { Dodge = 3, GMC, Chrysler = 7, Chevrolet };
// Dodge = 3, GMC = 4, Chrysler = 7, Chevrolet = 8
Auto aut = (Auto)7;   // int -> enum приведением`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`enum Auto { Dodge, GMC, Chrysler, Chevrolet };
int main() {
    std::cout << GMC << Chevrolet;
}`, answer: '13', explain: 'Нумерация по умолчанию с нуля: Dodge = 0, GMC = 1, Chrysler = 2, Chevrolet = 3.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`enum Auto { Dodge = 3, GMC, Chrysler = 7, Chevrolet };
int main() {
    std::cout << GMC << " " << Chevrolet;
}`, answer: '4 8', explain: 'Элемент без значения получает значение соседа слева плюс 1.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`enum Auto { Dodge = 0, GMC, Chrysler = 0, Chevrolet };
int main() {
    std::cout << Chevrolet + GMC;
}`, answer: '2', explain: 'GMC = 1, Chrysler = 0, Chevrolet = 1. Одинаковые значения допустимы.' },
  { type: 'choice', prompt: 'Можно ли двум элементам перечисления дать одинаковые значения?', options: ['Да, но имена должны различаться', 'Нет', 'Только если enum без имени', 'Только в языке C'], answer: 0,
    explain: 'Повторяться могут значения, а не имена.' },
  { type: 'input', prompt: 'Преврати число 2 в значение перечисления', code: C`enum Color { Red, Green, Blue };
int main() {
    Color c = (___)2;
    if (c == Blue) std::cout << "blue";
}`, answer: [['Color']], out: 'blue', explain: 'Число в enum переводят явным приведением. Обратно, из enum в `int`, — неявно.' },
  { type: 'code', prompt: 'Объяви перечисление `Color` с элементами `Red`, `Green`, `Blue`', rows: 1,
    accept: ['enum Color { Red, Green, Blue };'], re: [C`^enum Color\{Red,Green,Blue,?\}$`],
    bad: ['enum Color = { Red, Green, Blue };', 'enum { Red, Green, Blue } Color;', 'enum Color ( Red, Green, Blue );'],
    wrap: '{{}}\nint main() { Color c = Green; std::cout << c; }', out: '1',
    explain: 'Как в задании 2.15.5. После фигурной скобки нужна точка с запятой.' },
 ]},
 { id: 't15-2', title: 'Структуры struct', tasks: [
  th('Структура', `**Структура** объединяет данные разных типов в единое целое. Объявление ${q('struct')} описывает устройство типа, но память не выделяет: она выделяется при создании переменной.

Поля — через ${q('.')}, по указателю — через ${q('->')} или ${q('(*p).')}. При инициализации списком поля заполняются по порядку, недостающие — нулями.`,
  C`struct Student {
    int ID;
    int Age;
    char Name[20];
    float AverageMark;
};
Student stud = { 1122, 18, "John Wick" };
Student* p_stud = new Student;
p_stud->ID = 1122;      // то же, что (*p_stud).ID`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`struct Student {
    int ID;
    int Age;
    char Name[20];
    float AverageMark;
};
int main() {
    Student stud = {1122, 18, "John Wick"};
    std::cout << stud.Name << " " << stud.Age << " " << stud.AverageMark;
}`, answer: 'John Wick 18 0', explain: 'Для `AverageMark` значение в списке не задано, поэтому поле стало нулём.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`struct Point { int X; int Y; };
int main() {
    Point* p = new Point;
    p->X = 3;
    (*p).Y = 4;
    std::cout << p->X * p->Y;
    delete p;
}`, answer: '12', explain: '`p->X` и `(*p).X` — две записи одного и того же.' },
  { type: 'choice', prompt: 'Когда выделяется память под структуру?', options: ['При создании переменной этого типа', 'При объявлении struct', 'При компиляции файла', 'При вызове sizeof'], answer: 0,
    explain: 'Объявление — лишь описание типа, «чертёж».' },
  { type: 'bug', prompt: 'Какая строка не скомпилируется?', lines: L(C`struct Point { int X; int Y; };
int main() {
    Point* p = new Point;
    p.X = 5;
}`), answer: 3, cerr: true, fix: '    p->X = 5;', explain: 'У указателя нет полей. Нужно `p->X` или `(*p).X`.' },
  { type: 'input', prompt: 'Обратись к полю вложенной структуры', code: C`struct Point { int X; int Y; };
struct Circle {
    Point Center;
    int Radius;
};
int main() {
    Circle c = {{7, 5}, 3};
    std::cout << c.___.X + c.Radius;
}`, answer: [['Center']], out: '10', explain: 'Цепочка точек: структура → вложенная структура → поле.' },
  { type: 'code', prompt: 'Объяви структуру `Point` с двумя полями: `int X` и `int Y`', rows: 3,
    accept: ['struct Point { int X; int Y; };', 'struct Point { int X, Y; };'], re: [C`^struct Point\{int X;int Y;?\}$`, C`^struct Point\{int X,Y;?\}$`],
    alts: ['struct Point {\n    int X;\n    int Y;\n};'], bad: ['struct Point { X; Y; };', 'struct Point ( int X; int Y; );', 'struct { int X; int Y; } Point;'],
    wrap: '{{}}\nint main() { Point p = {1, 2}; std::cout << p.X + p.Y; }', out: '3',
    explain: 'После закрывающей фигурной скобки структуры обязательна точка с запятой.' },
 ]},
 { id: 't15-3', title: 'Размер и выравнивание', tasks: [
  th('Выравнивание полей', `Размер структуры **не меньше** суммы размеров полей. Компилятор размещает каждое поле по адресу, кратному размеру его типа, и между полями появляются пустые байты.

Если упорядочить поля по размеру, «дыр» становится меньше. ${q('#pragma pack(push, 1)')} … ${q('#pragma pack(pop)')} отключает выравнивание. Методы на размер не влияют.`,
  C`struct A  { char a; double b; bool c; float d; };   // 24
struct A3 { char a; bool c; float d; double b; };   // 16`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`struct A { char a; double b; bool c; float d; };
int main() { std::cout << sizeof(A); }`, answer: '24', explain: '`a` (1) + 7 пустых байт, `b` (8), `c` (1) + 3 пустых, `d` (4) — итого 24.' },
  { type: 'output', prompt: 'Поля переставлены. Что выведет программа?', code: C`struct A3 { char a; bool c; float d; double b; };
int main() { std::cout << sizeof(A3); }`, answer: '16', explain: '`a`, `c` (2 байта) + 2 пустых, `d` (4), `b` (8) — 16.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`#pragma pack(push, 1)
struct A5 { char a; double b; bool c; float d; };
#pragma pack(pop)
int main() { std::cout << sizeof(A5); }`, answer: '14', explain: 'Без выравнивания 1 + 8 + 1 + 4 = 14.' },
  { type: 'choice', prompt: 'Как уменьшить размер `struct A { char a; double b; bool c; float d; }`, не используя pragma?', options: ['Упорядочить поля по размеру', 'Добавить методы', 'Объявить поля static', 'Никак'], answer: 0,
    explain: 'Варианты A3 и A4 из пособия: группировка по возрастанию или убыванию размера.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`struct S {
    int x;
    int get() { return x; }
    void set(int v) { x = v; }
};
int main() { std::cout << sizeof(S); }`, answer: '4', explain: 'Методы общие для всех экземпляров и в объекте не хранятся.' },
  { type: 'choice', prompt: 'Чему равен `sizeof` структуры `{ char a; int b; }` при обычном выравнивании?', code: C`struct P { char a; int b; };
int main() { std::cout << sizeof(P); }`, options: ['8', '5', '4', '12'], answer: 0, mono: true, expect: true,
    explain: '`int` выравнивается по 4, поэтому после `char` идут 3 пустых байта.' },
  { type: 'input', prompt: 'Отключи выравнивание', code: C`#pragma pack(___, 1)
struct P { char c; int i; };
#pragma pack(pop)
int main() { std::cout << sizeof(P); }`, answer: [['push']], out: '5', explain: '`push` сохраняет текущее выравнивание и ставит 1, `pop` его восстанавливает.' },
 ]},
 { id: 't15-4', title: 'Структуры, функции и методы', tasks: [
  th('Передача структур и методы', `Структуру, как и встроенные типы, передают по значению, по указателю или по ссылке. В C++ структура — это класс, у которого все поля открыты, поэтому у неё могут быть **методы**.

Задание 2.15.5: перечисление ${q('Color')} и структура ${q('showColor')} с методом ${q('getName')}, который возвращает название цвета.`,
  C`struct showColor {
    Color clr;
    std::string getName() {
        switch (clr) {
            case Red: return "Red";
            case Blue: return "Blue";
            case Green: return "Green";
        }
    }
};`),
  { type: 'output', prompt: 'Листинг 2.12. Что выведет программа?', code: C`struct Student { int ID; };
void fun(Student St) { St.ID += 10; }
void fun2(Student* St) { St->ID += 10; }
void fun3(Student& St) { St.ID += 10; }
int main() {
    Student s = {1122};
    fun(s);
    std::cout << s.ID << " ";
    fun2(&s);
    fun3(s);
    std::cout << s.ID;
}`, answer: '1122 1142', explain: '`fun` изменила копию, а `fun2` и `fun3` — сам объект.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`enum Color { Red, Green, Blue };
struct showColor {
    Color clr;
    std::string getName() {
        switch (clr) {
            case Red: return "Red";
            case Blue: return "Blue";
            case Green: return "Green";
        }
        return "?";
    }
};
int main() {
    showColor a;
    a.clr = (Color)2;
    std::cout << a.getName();
}`, answer: 'Blue', explain: '2 — значение `Blue`.' },
  { type: 'choice', prompt: 'Упражнение 1 лабы 2.15.5 — добавить в `getName` секцию `default`. Зачем она нужна?', options: ['Чтобы обработать значения вне перечисления, например (Color)7', 'Без неё не скомпилируется', 'Чтобы switch работал быстрее', 'default обязателен в методах'], answer: 0,
    explain: 'Без `default` для такого значения функция дойдёт до конца, ничего не вернув, а это неопределённое поведение.' },
  { type: 'input', prompt: 'Вызови метод структуры', code: C`struct DataHandler {
    int* Data;
    int Size;
    void SetSize(int size) { Size = size; }
};
int main() {
    DataHandler dh;
    dh.___(500);
    std::cout << dh.Size;
}`, answer: [['SetSize']], out: '500', explain: 'К методам обращаются так же, как к полям: через точку.' },
  { type: 'order', prompt: 'Динамический массив структур showColor: собери код', pre: 'enum Color { Red, Green, Blue };\nstruct showColor { Color clr; std::string getName() { switch (clr) { case Red: return "Red"; case Green: return "Green"; default: return "Blue"; } } };',
    lines: L(C`showColor* a = new showColor[3];
for (int i = 0; i < 3; i++)
    a[i].clr = (Color)i;
std::cout << a[2].getName();
delete[] a;`), out: 'Blue', explain: 'Как в функции `dynamicColor`: выделить массив, заполнить, использовать, освободить через `delete[]`.' },
  { type: 'code', prompt: 'Напиши метод `double area()` для `struct Rect { double w, h; }`, который возвращает площадь', rows: 2,
    accept: ['double area() { return w * h; }'], re: [C`^double area\(\)\{return (w\*h|h\*w|this->w\*this->h);?\}$`],
    bad: ['double area() { std::cout << w * h; }', 'double area(w, h) { return w * h; }', 'void area() { return w * h; }'],
    wrap: 'struct Rect {\n    double w, h;\n    {{}}\n};\nint main() { Rect r = {2, 3.5}; std::cout << r.area(); }', out: '7',
    explain: 'Метод видит поля своей структуры напрямую, передавать их как аргументы не нужно.' },
 ]},
]},

{ id: 't16', ...B, ref: '§2.5.4, 2.6, задания 2.15.7, 2.15.11', title: 'Объединения и битовые поля', sub: 'union, sizeof, битовые поля, генератор чисел', lessons: [
 { id: 't16-1', title: 'Объединения union', tasks: [
  th('union', `**Объединение** — структура, все поля которой лежат **по одному адресу**. Одно и то же содержимое можно читать как данные разного типа. Что хранится сейчас — следит программист.

Размер объединения равен размеру самого большого поля. Список инициализации задаёт только **первое** поле.`,
  C`union Digit {
    unsigned char Byte;
    unsigned int Int;
    double Dbl;
};
// sizeof(Digit) = sizeof(double) = 8`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`union Digit { unsigned char Byte; unsigned int Int; double Dbl; };
int main() { std::cout << sizeof(Digit); }`, answer: '8', explain: 'Максимум из 1, 4 и 8 байт.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`union U { int i; char c; };
int main() {
    U u;
    u.i = 65;
    std::cout << u.c;
}`, answer: 'A', explain: 'Поле `c` — это младший байт того же числа (на x86 младший байт идёт первым). 65 — код буквы A.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`union Digit { unsigned char Byte; unsigned int Int; double Dbl; };
int main() {
    Digit d = { 7 };
    std::cout << (int)d.Byte;
}`, answer: '7', explain: 'Значение из списка инициализации попадает в первое поле — `Byte`.' },
  { type: 'output', prompt: 'Листинг 2.13. Что выведет программа?', code: C`union Digit { unsigned char Byte; unsigned int Int; double Dbl; };
int main() {
    Digit* d = new Digit;
    d->Dbl = 7.777;
    std::cout << d->Int;
    delete d;
}`, answer: '3813930959', explain: 'Записали `double`, а прочитали его младшие 4 байта как целое. Получилось «случайное» число.' },
  { type: 'choice', prompt: 'В чём главное отличие объединения от структуры?', options: ['Все поля union лежат по одному адресу', 'У union не может быть методов', 'В union нельзя хранить double', 'У union нет sizeof'], answer: 0,
    explain: 'Поэтому размер объединения — максимум из полей, а не их сумма.' },
  { type: 'input', prompt: 'Запиши значение в поле float', code: C`union Value {
    int i;
    float f;
};
int main() {
    Value v;
    v.___ = 2.5f;
    std::cout << v.f;
}`, answer: [['f']], out: '2.5', explain: 'Пишем и читаем одно и то же поле, тогда значение корректно.' },
  { type: 'code', prompt: 'Объяви объединение `Number` с полями `int i` и `double d`', rows: 3,
    accept: ['union Number { int i; double d; };'], re: [C`^union Number\{(int i;double d|double d;int i);?\}$`],
    bad: ['struct Number { int i; double d; };', 'union Number = { int i; double d; };'],
    wrap: '{{}}\nint main() { Number n; n.d = 1.5; std::cout << sizeof(Number) << n.d; }', out: '81.5',
    explain: 'Синтаксис тот же, что у структуры, только ключевое слово `union`.' },
 ]},
 { id: 't16-2', title: 'Тип + объединение (2.15.7)', tasks: [
  th('Задание 2.15.7: робот или человек', `Перечисление ${q('personType { robot, human }')} говорит, кто это, а объединение ${q('infoUnion { char* name; unsigned int ID; }')} хранит имя **или** номер. Структура ${q('Item')} содержит оба поля, и метод ${q('show')} по значению ${q('type')} решает, какое поле объединения читать.`,
  C`enum personType { robot, human };
union infoUnion {
    char *name;
    unsigned int ID;
};
struct Item {
    personType type;
    infoUnion info;
    void show();
};`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`enum personType { robot, human };
union infoUnion { const char* name; unsigned int ID; };
struct Item {
    personType type;
    infoUnion info;
    void show() {
        if (type == robot) std::cout << "ID " << info.ID;
        else std::cout << info.name;
    }
};
int main() {
    Item a, b;
    a.type = robot; a.info.ID = 7;
    b.type = human; b.info.name = "Ann";

int main() {

}`, answer: '2 4 8', explain: 'Пока установлен только младший бит, все XOR дают 0, и единица просто сдвигается влево.' },

 { id: 't19-4', title: 'Переменное число аргументов', tasks: [
  th('Функции с многоточием', `${q('type fun(type1 arg1, ...)')} — число параметров заранее неизвестно. Обычно первый параметр сообщает, сколько аргументов передано, либо последний служит стоп-значением.

Аргументы перебирают макросами из ${q('<cstdarg>')}: ${q('va_list')}, ${q('va_start')}, ${q('va_arg')}, ${q('va_end')}. В пособии есть и ручной обход стека через указатель, но он зависит от платформы. Макросы надёжнее.`,
  C`unsigned int sum3(int n, ...) {
    unsigned int res = 0;
    va_list vl;
    va_start(vl, n);
    for (int i = 0; i < n; i++)
        res += va_arg(vl, unsigned int);
    va_end(vl);
    return res;
}`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`unsigned int sum3(int n, ...) {

    va_list vl;
    va_start(vl, n);
    for (int i = 0; i < n; i++)
        res += va_arg(vl, unsigned int);
    va_end(vl);
    return res;
}
int main() { std::cout << sum3(5, 1, 2, 3, 4, 5); }`, answer: '15', explain: 'Первый аргумент (5) — количество слагаемых.' },
  { type: 'output', prompt: 'Стоп-значение. Что выведет программа?', code: C`int sumUntil(int first, ...) {
    int res = 0, v = first;

  { type: 'choice', prompt: 'Как функция с `...` узнаёт, сколько ей передали аргументов?', options: ['Из обязательного параметра или по стоп-значению', 'Сама, автоматически', 'Через sizeof(...)', 'Никак, их всегда 10'], answer: 0,

    return m;
}
int main() { std::cout << maxOf(4, 3, 9, 2, 7); }`, answer: [['va_start'], ['va_end']], out: '9', explain: '`va_start` готовит список после последнего обязательного параметра, `va_end` завершает работу с ним.' },
  { type: 'choice', prompt: 'Что вернёт `sum3(3, 10, 20, 30, 40)`?', options: ['60', '100', '10', '40'], answer: 0, mono: true, explain: 'Функция берёт ровно три слагаемых, как сказано в первом аргументе.' },
  { type: 'code', prompt: 'Напиши выражение, которое достаёт следующий аргумент типа `double` из списка `vl`', rows: 1,

    explain: 'Тип нужно указать явно: в списке аргументов типы не хранятся.' },
 ]},
]},

{ id: 't20', ...B, ref: '§2.9, задания 2.15.1, 2.15.10', title: 'Шаблоны', sub: 'template, параметры-константы, QuickSort, шаблонная структура', lessons: [
 { id: 't20-1', title: 'Шаблон функции', tasks: [
  th('template', `**Шаблон** позволяет писать алгоритмы, которые не зависят от типа данных: ${q('template<typename T>')}. Вместо ${q('typename')} можно писать ${q('class')}.

**Специализация** — экземпляр шаблона для конкретного типа. При вызове тип часто выводится сам: ${q('fun(1.0, 3.0)')}. Исполняемый код шаблоны не сокращают: для каждого набора типов компилятор создаёт отдельную функцию.`,
  C`template <typename T>
T fun(T first, T second) { ... }

int a = fun<int>(1, 2);
float d = fun(1.0f, 3.0f);   // T = float`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`template <typename T>
T myMax(T a, T b) { return a > b ? a : b; }
int main() {
    std::cout << myMax(3, 7) << " " << myMax(2.5, 1.5) << " " << myMax('a', 'z');
}`, answer: '7 2.5 z', explain: 'Одна запись — три специализации: для `int`, `double` и `char`.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`template <typename T>
T half(T x) { return x / 2; }
int main() {
    std::cout << half<int>(7) << " " << half<double>(7);
}`, answer: '3 3.5', explain: 'Тип указан явно. Для `int` деление целочисленное.' },
  { type: 'choice', prompt: 'Сколько экземпляров функции создаст компилятор для вызовов `fun<int>(1, 2)` и `fun<float>(1.0, 3.0)`?', options: ['2', '1', '0', 'По одному на каждый вызов в программе'], answer: 0,
    explain: 'По одной специализации на каждый тип. Повторные вызовы с тем же типом используют уже созданную.' },
  { type: 'bug', prompt: 'Какая строка не скомпилируется?', lines: L(C`template <typename T>
T add(T a, T b) { return a + b; }
int main() {
    std::cout << add(1, 2.5);
}`), answer: 3, cerr: true, fix: '    std::cout << add<double>(1, 2.5);',
    explain: 'По аргументам выходит `T = int` и `T = double` одновременно. Нужно указать тип явно: `add<double>(1, 2.5)`.' },
  { type: 'input', prompt: 'Объяви параметр шаблона', code: C`template <___ T>

int main() {
    show(5);
    show("hi");
}`, answer: [['typename', 'class']], out: '[5][hi]', explain: '`typename` и `class` здесь равнозначны.' },
  { type: 'code', prompt: 'Напиши шаблонную функцию `T sq(T x)`, которая возвращает квадрат аргумента', rows: 3,

    explain: 'Строка `template <...>` ставится перед заголовком функции.' },
 ]},
 { id: 't20-2', title: 'Несколько параметров и константы', tasks: [
  th('Параметры шаблона', `Параметров может быть несколько: ${q('template<typename T1, typename T2>')}. Параметром может быть и **целочисленное константное выражение**: ${q('template<int N>')}. Его значение известно при компиляции, поэтому им можно задать размер статического массива.`,
  C`template<typename T, int N>

  { type: 'output', prompt: 'Что выведет программа?', code: C`template <typename T1, typename T2>

  { type: 'output', prompt: 'Что выведет программа?', code: C`template <int N>

  { type: 'choice', prompt: 'Что можно передать в параметр `template<int N>`?', options: ['Целочисленную константу, известную при компиляции', 'Любую переменную int', 'Строку', 'Тип int'], answer: 0,

  { type: 'code', prompt: 'Вызови шаблонную функцию `sort<T, N>(arr, cmp)` из листинга 2.50 для `float arr[5]` и функции сравнения `greater`', rows: 1,
    accept: ['sort<float, 5>(arr, greater);', 'sort<float, 5>(arr, greater<float>);'], bad: ['sort(arr, greater);', 'sort<5, float>(arr, greater);', 'sort<float>(arr, greater);'],
    wrap: 'template<typename T>\nbool greater(T a, T b) { return a > b; }\ntemplate<typename T, int N>\nvoid sort(T* arr, bool (*cmpFun)(T, T)) {\n    for (int i = 0; i < N; i++)\n        for (int j = i + 1; j < N; j++)\n            if (cmpFun(arr[j], arr[i])) { T t = arr[i]; arr[i] = arr[j]; arr[j] = t; }\n}\nint main() {\n    float arr[5] = {0.1, 0.3, 0.2, 0.5, 0.8};\n    {{}}\n    std::cout << arr[0];\n}', out: '0.8',

 ]},
 { id: 't20-3', title: 'Быстрая сортировка (2.15.1)', tasks: [
  th('Шаблонная QuickSort', `Прототип из задания: ${q('template<typename T> void QuickSort(T* Arr, int N, bool (*CmpFun)(T, T));')}

{ id: 't23', ...B, ref: '§2.13, задания 2.15.2–2.15.4', title: 'Хэши, перебор, шифрование', sub: 'Хэш-функции, полный перебор, XOR, Луна на строках', lessons: [
 { id: 't23-1', title: 'Хэш-функции', tasks: [
  th('Что такое хэш', `**Хэш-функция** отображает входные данные в набор бит фиксированного размера: дайджест, контрольную сумму, хэш.

Применения: быстрый поиск, генераторы случайных чисел, хранение паролей, контроль целостности. Контрольные суммы (CRC) ловят случайные помехи, криптографические функции (MD5, SHA256, SHA3) — намеренные изменения и вычисляются сложнее. Изменение одного бита входа лавинообразно меняет хэш.`,
  C`unsigned int Hash(const char* Passwd, int Len) {
    unsigned int res = 0;
    for (int i = 0; i < Len; i++)
        res += Passwd[i];
    return (res<<16) ^ (Passwd[0] << 14) + ((Passwd[Len - 1] ^ Len) >> (Len >> 1));
}`),
  { type: 'choice', prompt: 'Что возвращает хэш-функция?', options: ['Набор бит фиксированного размера', 'Исходные данные', 'Данные той же длины, что и вход', 'Шифр, который можно расшифровать'], answer: 0,
    explain: 'Длина хэша не зависит от длины входа. Обратного преобразования нет.' },
  { type: 'choice', prompt: 'Чем криптографическая хэш-функция отличается от контрольной суммы CRC?', options: ['Она вычислительно сложнее и защищает от намеренных изменений', 'Она короче', 'Она обратима', 'Ничем'], answer: 0,

 { id: 't25-2', title: 'Конструктор копирования', tasks: [
  th('Копирование объектов', `**Конструктор копирования** создаёт объект на основе существующего: ${q('MyString(const MyString& Other)')}. Он вызывается в случаях ${q('MyString A(B);')}, ${q('MyString C = B;')}, при передаче объекта в функцию по значению и при возврате по значению.

Автоматический конструктор копирует поля как есть. Если поле — указатель на память, оба объекта будут указывать на один участок, и при освобождении получится беда. Нужно выделить новую память и скопировать данные.`,

 { id: 't25-3', title: 'Деструктор', tasks: [

{ id: 't26', ...V, ref: '§3.1.5', title: 'Перегрузка операторов', sub: 'operator+, присваивание, ограничения, практикум', lessons: [
 { id: 't26-1', title: 'Методом или глобальной функцией', tasks: [
  th('operator', `При перегрузке пишут ключевое слово ${q('operator')} и знак операции. Оператор перегружают **методом** (левый операнд — ${q('this')}) или **глобальной функцией**, которой доступен только открытый интерфейс класса.

- унарный оператор: метод без параметров или функция с одним параметром
- бинарный: метод с одним параметром или функция с двумя

Связь ${q('a++ ↔ a += 1')} после перегрузки не сохраняется сама собой.`,
  C`MyString str3 = str1 + str2;
MyString str3 = str1.operator+(str2);    // если метод
MyString str3 = operator+(str1, str2);   // если глобальная функция`),
  { type: 'output', prompt: 'Что выведет программа?', code: C`class Vec {
public:
    int x, y;
    Vec(int a, int b) { x = a; y = b; }
    Vec operator+(const Vec& o) { return Vec(x + o.x, y + o.y); }
};
int main() {
    Vec a(1, 2), b(3, 4);
    Vec c = a + b;
    std::cout << c.x << c.y;
}`, answer: '46', explain: '`a + b` — это `a.operator+(b)`. Здесь `a` выступает как `this`.' },
  { type: 'output', prompt: 'Глобальная функция. Что выведет программа?', code: C`class Vec {
public:
    int x, y;
    Vec(int a, int b) { x = a; y = b; }
};
Vec operator-(const Vec& a, const Vec& b) { return Vec(a.x - b.x, a.y - b.y); }
int main() {
    Vec c = operator-(Vec(5, 5), Vec(1, 2));
    std::cout << c.x << c.y;
}`, answer: '43', explain: 'Явный вызов глобального оператора — как в листинге 3.8.' },
  { type: 'choice', prompt: 'Сколько параметров у бинарного оператора, перегруженного **методом** класса?', options: ['Один', 'Два', 'Ноль', 'Три'], answer: 0,

  { type: 'code', prompt: 'Напиши метод `bool operator==(const Vec& o)`, который сравнивает поля `x` и `y`', rows: 2,

    wrap: 'class Vec {\npublic:\n    int x, y;\n    Vec(int a, int b) { x = a; y = b; }\n    {{}}\n};\nint main() { std::cout << (Vec(1, 2) == Vec(1, 2)) << (Vec(1, 2) == Vec(1, 3)); }', out: '10',

 ]},
 { id: 't26-2', title: 'Оператор присваивания', tasks: [
  th('operator=', `Оператор присваивания даёт **существующему** объекту новое значение. Если в классе есть указатели, его пишут вместе с конструктором копирования:

3. скопировать данные
4. вернуть ${q('*this')}`,

        this->length = Str.length;
        this->buffer = new char[this->length + 1];
        strcpy(this->buffer, Str.buffer);
    }
    return *this;
}
MyString A = B;   // конструктор копирования!
A = B;            // оператор присваивания`),
  { type: 'output', prompt: 'Конструктор или присваивание? Что выведет программа?', code: C`class T {

int main() {

    T c;
    c = a;
}`, answer: 'copy assign', explain: '`T b = a` создаёт новый объект — это копирование. `c = a` меняет уже существующий — это присваивание.' },
  { type: 'choice', prompt: 'Вопрос 15 для самопроверки: что вызовется в строках `MyClass b; b = a;`?', options: ['Оператор присваивания', 'Конструктор копирования', 'Оба по очереди', 'Ничего'], answer: 0,
    explain: '`b` уже создан конструктором по умолчанию, `=` меняет его значение.' },
  { type: 'choice', prompt: 'Зачем проверять `if (this != &Str)`?', options: ['При a = a иначе удалим свой буфер, а потом будем из него копировать', 'Чтобы ускорить присваивание', 'Это требование компилятора', 'Чтобы не вызвать конструктор'], answer: 0,
    explain: 'После `delete[] buffer` данные `Str.buffer` (тот же буфер) уже недействительны.' },
  { type: 'output', prompt: 'Цепочка присваиваний. Что выведет программа?', code: C`class N {

  { type: 'input', prompt: 'Верни ссылку на текущий объект', code: C`class N {

        if (this != &o) v = o.v;

    }
};
int main() {

{ id: 't27', ...V, ref: '§3.1.6–3.1.7', title: 'Перемещение и friend', sub: 'rvalue, конструктор и присваивание перемещением, дружественные функции', lessons: [
 { id: 't27-1', title: 'Анонимные объекты', tasks: [
  th('rvalue', `Значение, которое функция возвращает по значению, — **анонимный объект** (rvalue). Он временный и уничтожается после выполнения всей команды. При копировании таких объектов лишняя работа с памятью тратит время.

**Семантика перемещения** позволяет не копировать временный объект, а «забрать» его ресурсы. Ссылку на rvalue пишут как ${q('Type&&')}.`,
  C`int fun(int a) { return ++a; }
b = fun(a);   // результат fun — анонимный объект`),
  { type: 'choice', prompt: 'Что такое анонимный объект (rvalue)?', options: ['Временный объект без имени, например результат функции по значению', 'Объект в динамической памяти', 'Глобальный объект', 'Объект без полей'], answer: 0,
    explain: 'Он живёт до конца выражения, в котором возник.' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`void f(int& x) { std::cout << "lvalue "; }
void f(int&& x) { std::cout << "rvalue "; }
int main() {
    int a = 1;
    f(a);
    f(5);
    f(a + 1);
}`, answer: 'lvalue rvalue rvalue', explain: '`a` — именованная переменная (lvalue). `5` и `a + 1` — временные значения (rvalue).' },
  { type: 'output', prompt: 'Что выведет программа?', code: C`void f(int& x) { std::cout << "L"; }
void f(int&& x) { std::cout << "R"; }
int main() {
    int a = 1;
    f(std::move(a));
}`, answer: 'R', explain: '`std::move` превращает именованный объект в rvalue и разрешает его «опустошить».' },
  { type: 'choice', prompt: 'Для каких типов перемещение даёт выигрыш?', options: ['Для объектов, владеющих динамической памятью или другими ресурсами', 'Для int и char', 'Для bool', 'Ни для каких'], answer: 0,
    explain: 'Скопировать `int` так же быстро, как переместить. А строку на миллион символов — нет.' },
  { type: 'input', prompt: 'Объяви параметр — ссылку на rvalue', code: C`void take(std::string___ s) { std::cout << s.size(); }

  { type: 'choice', prompt: 'Что произойдёт, если в классе нет конструктора перемещения, а объект создаётся из временного?', options: ['Вызовется обычный конструктор копирования', 'Ошибка компиляции', 'Объект не создастся', 'Программа упадёт'], answer: 0,

 ]},
 { id: 't27-2', title: 'Конструктор перемещения', tasks: [
  th('MyString(MyString&& other)', `Конструктор перемещения делает «быструю» копию: забирает указатель у временного объекта, а у того записывает в указатель ${q('nullptr')}. Иначе деструктор временного объекта освободит память, которая теперь принадлежит новому.`,

 { id: 't27-3', title: 'Присваивание перемещением', tasks: [

 { id: 't27-4', title: 'Дружественные функции', tasks: [

  { type: 'choice', prompt: 'Является ли дружественная функция методом класса?', options: ['Нет, это глобальная функция с особым доступом', 'Да', 'Только если объявлена в public', 'Только для операторов'], answer: 0,

 { id: 't28-3', title: 'Удаление и поиск', tasks: [
  th('Delete и FindInList', `Для удаления меняют ${q('Next')} у **предыдущего** узла, чтобы он «перешагнул» удаляемый, а затем освобождают память. Голову удаляют отдельно: меняется сам ${q('*PListHead')}.

  C`SinglyLinkedList* FindInList(SinglyLinkedList* ListHead, int Val) {

  { type: 'output', prompt: 'Листинг 3.13: добавили 1, 2, 3, удалили 2. Что выведет программа?', code: C`struct L { int Data; L* Next; };
void Add(L** h, int v) {
    L* n = new L{v, NULL};
    if (*h == NULL) { *h = n; return; }
    L* t = *h;
    while (t->Next) t = t->Next;
    t->Next = n;
}
void Delete(L** h, int v) {
    if ((*h)->Data == v) { L* tmp = *h; *h = (*h)->Next; delete tmp; return; }
    for (L* cur = *h; cur->Next != NULL; cur = cur->Next)
        if (cur->Next->Data == v) { L* tmp = cur->Next; cur->Next = cur->Next->Next; delete tmp; break; }
}
int main() {
    L* Head = NULL;
    Add(&Head, 1); Add(&Head, 2); Add(&Head, 3);
    Delete(&Head, 2);
    for (L* c = Head; c; c = c->Next) std::cout << c->Data << " ";

 { id: 't29-2', title: 'Вставка', tasks: [
  th('Add для дерева', `Новый элемент всегда становится **листом**. Спускаемся от корня: если значение узла меньше нового — направо, иначе налево. Как только нужного поддерева нет, прицепляем новый узел и задаём ему ${q('Parent')}.`,
  C`while (tmp != NULL) {
    parent = tmp;
    if (tmp->Data < Val) tmp = tmp->Right;
    else tmp = tmp->Left;
}
newElem->Parent = parent;
if (parent->Data < Val) parent->Right = newElem;
else parent->Left = newElem;`),
  { type: 'output', prompt: 'Вставили 7, 1, 9, 5, 3. Что лежит слева и справа от корня?', code: C`struct T { int Data; T* Left; T* Right; };
void Add(T** root, int v) {
    T* n = new T{v, NULL, NULL};
    if (*root == NULL) { *root = n; return; }
    T* cur = *root; T* parent = NULL;
    while (cur) { parent = cur; cur = (cur->Data < v) ? cur->Right : cur->Left; }
    if (parent->Data < v) parent->Right = n; else parent->Left = n;
}
int main() {
    T* root = NULL;
    int arr[5] = {7, 1, 9, 5, 3};
    for (int x : arr) Add(&root, x);

 { id: 't30-3', title: 'Очередь: FIFO', tasks: [
  th('Очередь', `**Очередь** — «первым пришёл — первым ушёл» (FIFO). Операции:

- ${q('Front')} — первый элемент
- ${q('Back')} — последний
- ${q('Push')} — добавить в конец
- ${q('Pop')} — убрать из начала

Список для очереди хранит указатели и на начало, и на конец. Очередь с добавлением и удалением с обоих концов называется **двусторонней** (deque).`,
  C`struct Queue {
    DoublyLinkedList* Head;   // начало очереди
    DoublyLinkedList* Tail;   // конец очереди
};`),
  { type: 'output', prompt: 'Листинг 3.20. Что выведет программа?', code: C`struct D { int Data; D* Next; D* Prev; };
struct Queue { D* Head; D* Tail; };
void Push(Queue* q, int v) {
    D* t = new D{v, q->Tail, NULL};
    if (q->Tail) q->Tail->Prev = t;
    q->Tail = t;
    if (t->Next == NULL) q->Head = t;
}
void Pop(Queue* q) {
    D* t = q->Head;
    q->Head = q->Head->Prev;
    if (q->Head == NULL) q->Tail = NULL;
    delete t;
}
int main() {
    Queue qu = {NULL, NULL};
    for (int i = 0; i < 5; i++) Push(&qu, i);
    for (int i = 0; i < 5; i++) { std::cout << qu.Head->Data << " "; Pop(&qu); }
}`, answer: '0 1 2 3 4', explain: 'Элементы выходят в том же порядке, в каком пришли.' },

 { id: 't30-4', title: 'Стек и очередь: сравнение', tasks: [

 { id: 't31-1', title: 'Базовый и производный класс', tasks: [
  th('Наследование', `**Наследование** строит иерархию классов для переиспользования кода. Производный класс получает все поля и методы базового, может их переопределить и добавить свои. При **одиночном** наследовании базовый класс один, при **множественном** — два и больше.

 { id: 't31-2', title: 'Доступ при наследовании', tasks: [

 { id: 't31-3', title: 'Порядок конструкторов', tasks: [
  th('Создание и уничтожение', `При создании объекта сначала вызываются конструкторы базовых классов **сверху вниз**, затем конструкторы полей, затем конструктор самого класса. Деструкторы вызываются в **обратном** порядке.

  { type: 'output', prompt: 'Листинг 3.25: поля и базовые классы. Что выведет программа?', code: C`class A { public: A() { std::cout << "A"; } };

 { id: 't31-4', title: 'Одноимённые члены и размер', tasks: [

  th('Задание 3.7.7: PrintIdx, PrintAt, PrintIterator', `Шаблонная функция с параметром-контейнером работает с любым контейнером, у которого есть нужные методы. ${q('PrintIdx')} выводит элементы через ${q('[]')}, ${q('PrintAt')} — через ${q('at')}, ${q('PrintIterator')} — итераторами. Все три подходят для ${q('std::array')}, ${q('std::vector')} и ${q('std::deque')}.

const KIND = {
  theory: ['Теория из пособия', 'book'], choice: ['Выбери ответ', 'star'], output: ['Что выведет программа', 'code'],
  fill: ['Заполни пропуски', 'code'], bug: ['Найди ошибку', 'code'], order: ['Собери код', 'code'],
  input: ['Впиши код', 'pen'], code: ['Напиши код', 'pen'],
};

const R = {
  theory(t, ready) {
    ready(true);
    const card = h('div', { class: 'thcard' });
    if (t.text) card.insertAdjacentHTML('beforeend', mdBlock(t.text));
    if (t.code) card.append(pre(t.code));
    if (t.after) card.insertAdjacentHTML('beforeend', mdBlock(t.after));
    return { el: [card, t.unitRef ? h('div', { class: 'thref' }, 'Пособие ' + t.unitRef) : null], check() { return { ok: true }; } };
  },
  choice(t, ready) {
    let sel = null; const btns = [];
    const box = h('div', { class: 'opts' });
    const order = t.keep ? t.options.map((_, i) => i) : shuffle(t.options.map((_, i) => i));
    order.forEach((i, n) => {
      const b = h('button', { class: 'opt' + (t.mono ? ' mono' : ''), onclick: () => { sel = i; btns.forEach(x => x.classList.toggle('sel', x === b)); ready(true); } },
        h('span', { class: 'k' }, n + 1), h('span', { html: md(t.options[i]) }));
      b.dataset.i = i; btns.push(b); box.append(b);
    });
    return {
      el: [t.code ? pre(t.code) : null, box],
      key(k) { const b = btns[+k - 1]; if (b && !b.disabled) b.click(); },
      check() {
        const ok = sel === t.answer; btns.forEach(b => b.disabled = true);
        btns.forEach(b => { if (+b.dataset.i === t.answer) b.classList.add('right'); else if (+b.dataset.i === sel) b.classList.replace('sel', 'wrong'); });
        return { ok, ans: md(t.mono ? '`' + t.options[t.answer] + '`' : t.options[t.answer]) };
      }
    };
  },
  output(t, ready) {
    const multi = /\n/.test(String(t.answer).trim());
    const inp = h('input', Object.assign({ class: 'out-in', type: 'text', id: 'out-' + Math.random().toString(36).slice(2), placeholder: 'Напиши, что появится на экране', enterkeyhint: 'go', 'aria-label': 'Вывод программы' }, TYPING));
    inp.addEventListener('input', () => ready(inp.value.trim().length > 0));
    setTimeout(() => { if (fine()) inp.focus(); }, 50);
    return {
      el: [t.stdin != null ? h('div', { class: 'hint', html: 'Пользователь вводит: <code>' + esc(t.stdin) + '</code>' }) : null, pre(t.code), inp,
        multi ? h('div', { class: 'hint' }, 'Строки вывода можно разделять пробелами') : null],
      check() {
        const ok = UK.norm(inp.value) === UK.norm(t.answer); inp.disabled = true; inp.classList.add(ok ? 'right' : 'wrong');
        return { ok, ans: `<pre class="code">${esc(String(t.answer).trim())}</pre>` };
      }
    };
  },
  fill(t, ready) {
    const slots = [], fill = [];
    let html = hl(t.code), k = 0;
    html = html.replace(/___/g, () => `<button class="slot" data-i="${k++}" aria-label="Пропуск"></button>`);
    const code = h('pre', { class: 'code', html });
    code.querySelectorAll('.slot').forEach(s => { slots.push(s); fill.push(null); });
    const tiles = [];
    const bank = h('div', { class: 'bank' });
    const sync = () => {
      slots.forEach((s, i) => { s.textContent = fill[i] == null ? '' : t.bank[fill[i]]; s.classList.toggle('f', fill[i] != null); });
      tiles.forEach((b, j) => { const u = fill.includes(j); b.classList.toggle('used', u); b.disabled = u; });
      ready(fill.every(v => v != null));
    };
    shuffle(t.bank.map((_, j) => j)).forEach(j => {
      const b = h('button', { class: 'tile', onclick: () => { const i = fill.indexOf(null); if (i >= 0) { fill[i] = j; sync(); } } }, t.bank[j]);
      tiles[j] = b; bank.append(b);
    });
    slots.forEach((s, i) => s.addEventListener('click', () => { if (!s.disabled && fill[i] != null) { fill[i] = null; sync(); } }));
    return {
      el: [code, bank],
      check() {
        let ok = true;
        slots.forEach((s, i) => { const r = t.bank[fill[i]] === t.answer[i]; ok = ok && r; s.classList.add(r ? 'right' : 'wrong'); s.disabled = true; });
        tiles.forEach(b => b.disabled = true);
        let n = 0; const full = t.code.replace(/___/g, () => t.answer[n++]);
        return { ok, ans: `<pre class="code">${hl(full)}</pre>` };
      }
    };
  },
  input(t, ready) {
    let html = hl(t.code), k = 0;
    html = html.replace(/___/g, () => {
      const v = [].concat(t.answer[k])[0], w = Math.max(3, String(v).length + 1);
      return `<input class="blank" data-i="${k++}" type="text" style="width:${w}ch" aria-label="Пропуск ${k}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">`;
    });
    const code = h('pre', { class: 'code', html });
    const inputs = [...code.querySelectorAll('.blank')];
    const sync = () => ready(inputs.every(i => i.value.trim().length > 0));
    inputs.forEach(i => i.addEventListener('input', sync));
    setTimeout(() => { if (fine() && inputs[0]) inputs[0].focus(); }, 50);
    return {
      el: [code, h('div', { class: 'hint' }, inputs.length > 1 ? 'Впиши код во все пропуски' : 'Впиши код в пропуск')],
      check() {
        let ok = true;
        inputs.forEach((inp, i) => { const r = UK.okBlank(inp.value, t.answer[i]); ok = ok && r; inp.classList.add(r ? 'right' : 'wrong'); inp.disabled = true; });
        let n = 0; const full = t.code.replace(/___/g, () => [].concat(t.answer[n++])[0]);
        return { ok, ans: `<pre class="code">${hl(full)}</pre>` };
      }
    };
  },
  code(t, ready) {
    const ta = h('textarea', Object.assign({ class: 'code-in', rows: t.rows || 3, placeholder: t.ph || 'Пиши код здесь', 'aria-label': 'Твой код' }, TYPING));
    ta.addEventListener('input', () => ready(ta.value.trim().length > 0));
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 4; }
    });
    setTimeout(() => { if (fine()) ta.focus(); }, 50);
    return {
      el: [t.code ? pre(t.code) : null, ta, h('div', { class: 'hint' }, 'Пробелы и переносы строк не важны' + (fine() ? ' · Ctrl+Enter — проверить' : ''))],
      check() {
        const ok = UK.okCode(ta.value, t); ta.disabled = true; ta.classList.add(ok ? 'right' : 'wrong');
        return { ok, ans: `<pre class="code">${hl(t.sample || t.accept[0])}</pre>`, label: ok ? 'Эталонное решение:' : null };
      }
    };
  },
  bug(t, ready) {
    let sel = null; const rows = [];
    const box = h('div', { class: 'buglist' });
    t.lines.forEach((ln, i) => {
      const b = h('button', { class: 'bl', onclick: () => { sel = i; rows.forEach((r, j) => r.classList.toggle('sel', j === i)); ready(true); } },
        h('span', { class: 'ln' }, i + 1), h('span', { class: 'tx', html: hl(ln) || ' ' }));
      rows.push(b); box.append(b);
    });
    return {
      el: [box],
      check() {
        const ok = sel === t.answer; rows.forEach(r => r.disabled = true);
        rows[t.answer].classList.add('right'); if (!ok) rows[sel].classList.replace('sel', 'wrong');
        return { ok, ans: `Строка ${t.answer + 1}: <code>${esc(t.lines[t.answer].trim())}</code>` };
      }
    };
  },
  order(t, ready) {
    let order = shuffle(t.lines.map((_, i) => i));
    for (let g = 0; g < 10 && order.every((v, i) => v === i); g++) order = shuffle(order);
    const picked = [];
    const ans = h('div', { class: 'ans' });
    const bank = h('div', { class: 'bank col' });
    const tiles = {};
    const sync = () => {
      ans.innerHTML = '';
      picked.forEach((j, p) => ans.append(h('button', { class: 'tile', html: hl(t.lines[j].trim()), onclick: () => { if (!ans.dataset.lock) { picked.splice(p, 1); sync(); } } })));
      order.forEach(j => { const u = picked.includes(j); tiles[j].classList.toggle('used', u); tiles[j].disabled = u || !!ans.dataset.lock; });
      ready(picked.length === t.lines.length);
    };
    order.forEach(j => { tiles[j] = h('button', { class: 'tile', html: hl(t.lines[j].trim()), onclick: () => { picked.push(j); sync(); } }); bank.append(tiles[j]); });
    sync();
    return {
      el: [ans, bank],
      check() {
        ans.dataset.lock = '1';
        const ok = picked.map(j => t.lines[j].trim()).join('\n') === t.lines.map(s => s.trim()).join('\n');
        ans.querySelectorAll('.tile').forEach(b => b.disabled = true); Object.values(tiles).forEach(b => b.disabled = true);
        ans.classList.add(ok ? 'right' : 'wrong');
        return { ok, ans: `<pre class="code">${hl(t.lines.join('\n'))}</pre>` };
      }
    };
  },
};

/* ===================== УРОК ===================== */
let S = null;
const PRAISE = ['Отлично!', 'Верно!', 'Так держать!', 'Точно в цель!', 'Компилируется!', 'Без единого warning!'];
function startLesson(l) {
  S = { l, queue: l.tasks.slice(), pos: 0, hearts: 5, correct: 0, total: l.tasks.length, missed: new Set(), t0: Date.now(), phase: 'answer', cur: null };
  app.hidden = true;
  const root = h('div', { class: 'lesson', id: 'lesson' });
  root.append(
    h('div', { class: 'lbar' }, h('div', { class: 'wrap' },
      h('button', { class: 'x', 'aria-label': 'Выйти из урока', onclick: askExit, html: IC.close }),
      h('div', { class: 'prog', role: 'progressbar', 'aria-label': 'Прогресс урока' }, h('i')),
      h('div', { class: 'hearts', 'aria-label': 'Жизни' }, icon('heart'), h('span', { id: 'hn' }, '5')))),
    h('div', { class: 'lbody' }, h('div', { class: 'wrap', id: 'lb' })),
    h('div', { class: 'lfoot', id: 'lf' }, h('div', { class: 'wrap' },
      h('div', { class: 'fb', id: 'fb', hidden: true }),
      h('button', { class: 'btn wide', id: 'go', disabled: true, onclick: onGo }, 'Проверить'))));
  document.body.append(root);
  window.scrollTo(0, 0);
  renderTask();
}
function askExit() {
  openSheet([h('h3', null, 'Выйти из урока?'), h('p', null, 'Прогресс этого урока не сохранится.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: closeSheet }, 'Продолжить урок'),
      h('button', { class: 'btn ghost', onclick: () => { closeSheet(); endLesson(); } }, 'Выйти'))]);
}
function endLesson() { const r = document.getElementById('lesson'); r && r.remove(); S = null; renderHome(); window.scrollTo(0, 0); }
function setProg() { document.querySelector('.prog i').style.width = (S.correct / S.total * 100) + '%'; }
function renderTask() {
  const t = S.queue[S.pos];
  const lb = document.getElementById('lb'); lb.innerHTML = '';
  const again = S.missed.has(t);
  const [kname, kic] = KIND[t.type];
  if (t.type === 'theory') t.unitRef = t.ref || S.l.unit.ref;
  lb.append(h('div', { class: 'kind' + (again ? ' again' : '') + (t.type === 'theory' ? ' th' : '') }, icon(again ? 'redo' : kic), again ? 'Ещё раз: работа над ошибкой' : kname),
    h('h2', { class: 'prompt', html: md(t.prompt || t.title || '') }));
  const go = document.getElementById('go');
  S.cur = R[t.type](t, ok => { if (S.phase === 'answer') go.disabled = !ok; });
  lb.append(...[S.cur.el].flat().filter(Boolean));
  const lf = document.getElementById('lf'); lf.className = 'lfoot';
  document.getElementById('fb').hidden = true;
  S.phase = 'answer';
  if (t.type === 'theory') { go.textContent = 'Понятно'; go.disabled = false; }
  else { go.textContent = 'Проверить'; go.disabled = true; }
  window.scrollTo(0, 0);
  setProg();
}
function next() {
  if (S.hearts === 0) return showResult(false);
  S.pos++;
  if (S.pos >= S.queue.length) return showResult(true);
  renderTask();
}
function onGo() {
  const go = document.getElementById('go');
  if (go.disabled) return;
  const t = S.queue[S.pos];
  if (t.type === 'theory' && S.phase === 'answer') { S.correct++; return next(); }
  if (S.phase === 'answer') {
    const res = S.cur.check();
    const lf = document.getElementById('lf'), fb = document.getElementById('fb');
    fb.innerHTML = '';
    if (res.ok) {
      S.correct++;
      fb.append(h('h4', null, icon('check'), PRAISE[Math.floor(Math.random() * PRAISE.length)]));
      if (res.label) fb.append(h('div', { class: 'lab', style: 'color:var(--green-d)' }, res.label), h('div', { html: res.ans }));
    } else {
      S.hearts--; S.missed.add(t); S.queue.push(t);
      document.getElementById('hn').textContent = S.hearts;
      const hs = document.querySelector('.hearts'); hs.classList.remove('hit'); void hs.offsetWidth; hs.classList.add('hit');
      fb.append(h('h4', null, icon('cross'), 'Не совсем'), h('div', { class: 'lab' }, 'Правильный ответ:'), h('div', { html: res.ans }));
      const lb = document.getElementById('lb'); lb.classList.remove('shake'); void lb.offsetWidth; lb.classList.add('shake');
    }
    fb.append(h('p', { html: md(t.explain) }));
    fb.hidden = false;
    lf.className = 'lfoot ' + (res.ok ? 'ok' : 'bad');
    go.textContent = S.hearts === 0 ? 'Завершить' : 'Дальше';
    S.phase = 'next'; setProg(); go.focus();
  } else next();
}
function showResult(win) {
  const sec = Math.round((Date.now() - S.t0) / 1000);
  const time = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  const gr = graded(S.l);
  const firstTry = gr - S.missed.size;
  const acc = gr ? Math.round(firstTry / gr * 100) : 100;
  const root = document.getElementById('lesson'); root.innerHTML = '';
  const wrap = h('div', { class: 'wrap', style: 'flex:1;display:flex;flex-direction:column;width:100%;box-sizing:border-box' });
  if (win) {
    const xp = 10 + firstTry * 2;
    state.xpDev[DEV] = (state.xpDev[DEV] || 0) + xp; state.xp += xp; state.done[S.l.id] = true;
    const td = today();
    if (state.last !== td) { state.streak = state.last === yesterday() ? state.streak + 1 : 1; state.last = td; }
    save();
    wrap.append(h('div', { class: 'result' },
      h('div', { class: 'big pop' }, icon('star')),
      h('h2', null, acc === 100 ? 'Идеально, без ошибок!' : 'Урок пройден!'),
      h('p', null, `${S.l.title} · серия ${state.streak} ${plural(state.streak, 'день', 'дня', 'дней')}`),
      h('div', { class: 'tiles' },
        stat('Опыт', '+' + xp, '--gold'), stat('Точность', acc + '%', '--green'), stat('Время', time, '--blue')),
      h('button', { class: 'btn wide', onclick: endLesson }, 'Продолжить')));
  } else {
    const l = S.l;
    wrap.append(h('div', { class: 'result fail' },
      h('div', { class: 'big' }, icon('heart')),
      h('h2', null, 'Жизни закончились'),
      h('p', null, 'Ничего страшного: ошибки здесь для того, чтобы на них учиться. Разборы ты уже видел, попробуй ещё раз.'),
      h('div', { class: 'row', style: 'display:flex;gap:10px;flex-wrap:wrap' },
        h('button', { class: 'btn', style: 'flex:1 1 160px', onclick: () => { root.remove(); startLesson(l); } }, 'Ещё раз'),
        h('button', { class: 'btn ghost', style: 'flex:1 1 160px', onclick: endLesson }, 'На карту'))));
  }
  root.append(wrap);
  window.scrollTo(0, 0);
  const b = root.querySelector('.btn'); b && b.focus();
}
const stat = (k, v, c) => h('div', { class: 'st', style: `--c:var(${c})` }, h('div', { class: 'h' }, k), h('div', { class: 'v' }, v));
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetEl) { closeSheet(); return; }
  if (!S || sheetEl) return;
  const tag = e.target.tagName;
  if (e.key === 'Enter' && tag === 'TEXTAREA') { if (e.ctrlKey || e.metaKey) { e.preventDefault(); onGo(); } return; }
  if (e.key === 'Enter' && tag !== 'BUTTON') { e.preventDefault(); onGo(); }
  else if (/^[1-6]$/.test(e.key) && S.phase === 'answer' && S.cur.key && tag !== 'INPUT' && tag !== 'TEXTAREA') S.cur.key(e.key);
});
/* без этого :active-нажатия не видны в iOS Safari */
document.addEventListener('touchstart', () => {}, { passive: true });
renderHome();
startAccount();

</script>
